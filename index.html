<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell The Predator : Breed &amp; Bleed</title>
<style>
/* =====================================================================
   스타일 — Bio-Lab Monitor 컨셉 (심해색 배경 + 네온 발광)
   ===================================================================== */
:root{
  --bg:#050A10; --panel:#07111b; --panel2:#0a1724; --line:#14304a; --line2:#1e4566;
  --text:#bcd6e8; --dim:#5d7d94; --green:#39ff8a; --cyan:#22e4ff; --red:#ff2d55; --gold:#ffd166;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:"JetBrains Mono","D2Coding",Consolas,"Malgun Gothic",monospace;font-size:13px;overflow:hidden;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.35;filter:grayscale(.7)}
#app{display:grid;grid-template-rows:60px minmax(0,1fr) 184px;grid-template-columns:minmax(0,1fr) 330px;height:100vh;gap:8px;padding:8px}
.panel,header,#market{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:8px}
.ptitle{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.ptitle span{letter-spacing:.05em}
.g{color:var(--green)} .c{color:var(--cyan)} .r{color:var(--red)} .neg{color:var(--red)} .pos{color:var(--green)}

/* ---------- 헤더 ---------- */
header{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:0 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:220px}
.logo{width:34px;height:34px;display:grid;place-items:center;color:var(--red);font-size:22px;
  border:1px solid #5a1424;border-radius:8px;text-shadow:0 0 10px var(--red);background:#14060b}
.title{font-weight:800;letter-spacing:.12em;font-size:15px;color:#e8f4ff}
.sub{font-size:10px;letter-spacing:.2em;color:var(--dim)}
.hstats{display:flex;gap:22px;align-items:center;flex:1;min-width:0}
.stat{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
.stat label{font-size:10px;color:var(--dim);letter-spacing:.1em}
.stat>span{font-size:15px;font-weight:700}
.stat.money>span{font-size:20px;color:var(--gold);text-shadow:0 0 12px rgba(255,209,102,.35)}
.stat.money>span.flash-up{animation:mup .6s}
@keyframes mup{0%{color:#fff;text-shadow:0 0 18px var(--green)}100%{}}
.goal{min-width:160px}
.goalbar{height:6px;background:#0d2033;border-radius:3px;overflow:hidden;width:160px}
.goalbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));box-shadow:0 0 8px var(--gold)}
.goal span{font-size:11px!important;color:var(--dim)}
.pop b{margin-right:8px;font-weight:700} .pop i{font-style:normal}
.hctrl{display:flex;gap:10px;align-items:center}
.speed{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.speed button{background:transparent;border:0;padding:7px 11px;font-weight:700;color:var(--dim)}
.speed button.on{background:#123553;color:var(--cyan);text-shadow:0 0 8px var(--cyan)}

/* ---------- 메인 캔버스 ---------- */
#stage{grid-row:2;grid-column:1;position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#02060a;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
[data-tip]{cursor:help}
#tip{position:fixed;z-index:25;width:max-content;max-width:340px;background:#0a1826;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;
  font-size:12px;line-height:1.6;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.6)}
#tip.hidden{display:none}
#tip b{color:#fff}
#tip .f{margin:6px 0 2px;padding:6px 8px;background:#06101a;border-left:2px solid var(--gold);color:var(--gold);font-size:11.5px}
#tip .calc{color:var(--text);font-size:11.5px;padding:0 8px}
#tip .dim{color:var(--dim);font-size:11px;margin-top:6px}
#toasts{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:46%}
.toast{background:rgba(6,14,22,.86);border:1px solid var(--line2);border-left:3px solid var(--cyan);padding:7px 10px;border-radius:5px;
  font-size:12px;animation:tin .25s ease-out;transition:opacity .5s}
.toast.warn{border-left-color:var(--gold)} .toast.bad{border-left-color:var(--red);color:#ffc2cd} .toast.good{border-left-color:var(--green)}
@keyframes tin{from{transform:translateX(-12px);opacity:0}}
#guide{position:absolute;left:16px;bottom:16px;width:min(430px,62%);background:#1c1505;border:2px solid var(--gold);border-radius:10px;color:#fff3d6;
  padding:12px 14px;font-size:14px;line-height:1.6;box-shadow:0 0 28px rgba(255,209,102,.35);animation:tin .3s ease-out,gpulse 1.6s infinite alternate}
@keyframes gpulse{from{box-shadow:0 0 14px rgba(255,209,102,.2)}to{box-shadow:0 0 34px rgba(255,209,102,.55)}}
#guide.hidden{display:none}
#guide b{color:var(--gold)}
.gstep{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--gold);margin-bottom:4px;display:flex;justify-content:space-between}
.gstep button{background:transparent;border:0;color:var(--dim);font-size:10px;letter-spacing:.05em;text-decoration:underline}
.guide-hi{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px;animation:ghi .9s infinite alternate}
@keyframes ghi{from{outline-color:rgba(255,209,102,.35)}to{outline-color:rgba(255,209,102,1)}}
#pauseTag{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;color:var(--dim);pointer-events:none}

/* ---------- 마켓 호가창 ---------- */
#market{grid-row:2;grid-column:2;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-height:0;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.cycle .bar{height:6px;background:#0d2033;border-radius:3px;overflow:hidden;margin-top:6px}
.cycle .bar i{display:block;height:100%;width:100%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.cycle .row span:last-child{font-weight:700;color:var(--cyan)}
.event{margin-top:6px;font-size:11px;color:var(--dim);min-height:15px}
.event.spike{color:var(--red);font-weight:700} .event.crash{color:#7fa3ff}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#061019;position:relative;transition:border-color .2s}
.card .nm{font-weight:700}
.card .hold{font-size:11px;color:var(--dim)} .card .hold b{color:var(--text)}
.price{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 2px}
.price>span:first-child{font-size:26px;font-weight:800;letter-spacing:.02em}
.card.herb .price>span:first-child{color:var(--cyan);text-shadow:0 0 12px rgba(34,228,255,.35)}
.card.carn .price>span:first-child{color:var(--red);text-shadow:0 0 12px rgba(255,45,85,.4)}
.chg{font-weight:700;font-size:13px}
.spark{width:100%;height:26px;display:block}
.small{font-size:11px;color:var(--dim);margin-top:4px} .small b{color:var(--text)}
.card.hot{animation:hot .8s infinite alternate;border-color:var(--red)}
.card.hot::after{content:"HIGH";position:absolute;right:10px;top:-8px;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:3px;letter-spacing:.1em}
@keyframes hot{from{box-shadow:0 0 0 rgba(255,45,85,0);background:#061019}to{box-shadow:0 0 22px rgba(255,45,85,.45) inset;background:#1a0710}}
.card.herb{border-color:#15485c} .card.carn{border-color:#5a1a2c}
.sellrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.sell{padding:8px 6px;border-radius:6px;font-weight:800;font-size:14px;border:1px solid;position:relative}
.sell small{display:block;font-size:10.5px;font-weight:400;margin-top:2px;opacity:.85}
.sell.herb{background:rgba(34,228,255,.10);border-color:rgba(34,228,255,.5);color:#c8f8ff}
.sell.herb:hover:not(:disabled){background:rgba(34,228,255,.2);box-shadow:0 0 12px rgba(34,228,255,.4)}
.sell.carn{background:rgba(255,45,85,.13);border-color:rgba(255,45,85,.55);color:#ffd3dc}
.sell.carn:hover:not(:disabled){background:rgba(255,45,85,.25);box-shadow:0 0 14px rgba(255,45,85,.5)}
.sell .neg{color:#ff8a9e}
.storage{margin-top:10px;padding-top:8px;border-top:1px dashed #5a1a2c}
.stlbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:#9fe8ff}
#stCount{font-size:13px;color:#cdefff}
.stslots{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 2px}
.stslots i{width:9px;height:9px;border-radius:2px;border:1px solid #23506a;background:#081521}
.stslots i.on{background:#ff2d55;border-color:#ff8fa3;box-shadow:0 0 5px rgba(255,45,85,.7)}
.stbtn{padding:7px 6px;border-radius:6px;font-weight:800;font-size:13px;border:1px solid rgba(120,220,255,.5);background:rgba(120,220,255,.08);color:#d4f4ff}
.stbtn small{display:block;font-size:10px;font-weight:400;margin-top:2px;opacity:.85}
.stbtn:hover:not(:disabled){background:rgba(120,220,255,.18)}
.stbtn.sellst{border-color:rgba(255,209,102,.6);background:rgba(255,209,102,.1);color:#ffe9b8}
.stbtn.sellst:hover:not(:disabled){background:rgba(255,209,102,.22)}
.stfee{font-size:10px;color:var(--dim);margin-top:5px}
.fee{font-size:10px;color:var(--dim);text-align:center}
.log{font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:3px;border-top:1px dashed var(--line);padding-top:8px;min-height:60px}
.log div b{color:var(--gold)}

/* ---------- 하단 컨트롤 ---------- */
#controls{grid-row:3;grid-column:1/3;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px;min-height:0}
#controls .panel{padding:12px;min-height:0}
.free{color:var(--green);border:1px solid #1d5a3a;border-radius:3px;padding:0 5px;font-size:10px}
.paid{color:var(--gold);border:1px solid #5a4a1d;border-radius:3px;padding:0 5px;font-size:10px}
.lvtag{color:var(--gold);border:1px solid #5a4a1d;border-radius:3px;padding:0 6px;font-size:11px;font-weight:800}
.lvpips{display:flex;gap:3px}
.lvpips i{width:14px;height:5px;border-radius:2px;background:#16324a}
.lvpips i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.ctrow{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px;align-items:center}
.ctcap{font-size:12px;margin-bottom:6px} .ctcap b{font-size:16px}
.capbar{height:16px;background:#0d2033;border-radius:4px;overflow:hidden;position:relative;border:1px solid var(--line2)}
.capbar i{display:block;height:100%;width:0;background:var(--green);box-shadow:0 0 10px var(--green);transition:width .2s}
.capbar.warn i{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.capbar.over{border-color:var(--red);animation:capblink .5s infinite alternate}
@keyframes capblink{to{border-color:#ff9db0;box-shadow:0 0 14px rgba(255,45,85,.7)}}
.capbar.over i{background:var(--red);box-shadow:0 0 12px var(--red)}
.ctsub{font-size:11px;color:var(--dim);margin-top:6px}
#ctState.over{color:var(--red);font-weight:800}
.ctnote{font-size:10.5px;color:var(--dim);margin-top:8px;line-height:1.5}
.ib.up{height:100%;justify-content:center}
.ib.up b{color:var(--gold);font-size:15px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#0e2338;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--thumb,var(--cyan));box-shadow:0 0 10px var(--thumb,var(--cyan));cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;border:0;background:var(--thumb,var(--cyan));box-shadow:0 0 10px var(--thumb,var(--cyan))}
.ibtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ib{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:8px;background:#0b1a28;border:1px solid var(--line2);text-align:left}
.ib b{font-size:13px} .ib span{font-size:10px;color:var(--dim)} .ib em{font-style:normal;font-weight:800;color:var(--gold);font-size:16px}
.ib.herb b{color:var(--cyan)} .ib.carn b{color:var(--red)} .ib.feed b{color:var(--green)}
.ib:hover:not(:disabled){border-color:var(--gold);box-shadow:0 0 10px rgba(255,209,102,.25)}
.keys{margin-top:10px;font-size:10px;color:var(--dim);line-height:1.6}
.keys kbd{border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--text);font-family:inherit}

/* ---------- 오버레이 (시작/종료) ---------- */
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(2,6,10,.72);backdrop-filter:blur(3px);z-index:20}
#overlay.hidden{display:none}
.ovbox{width:min(660px,92vw);border:1px solid var(--line2);border-radius:12px;background:rgba(7,17,27,.94);padding:30px 34px;text-align:center;box-shadow:0 0 60px rgba(34,228,255,.08)}
.ovbox h1{font-size:34px;letter-spacing:.14em;color:#eaf6ff;text-shadow:0 0 18px rgba(255,45,85,.5)}
.ovbox h2{font-size:14px;letter-spacing:.4em;color:var(--red);margin-top:4px}
.ovbox .tag{display:inline-block;margin:16px 0 18px;padding:4px 12px;border:1px solid var(--line2);border-radius:20px;font-size:11px;letter-spacing:.15em;color:var(--cyan)}
.ovbox ul{list-style:none;text-align:left;line-height:1.9;font-size:13px;margin:0 auto 14px;max-width:470px}
.linkbtn{background:transparent;border:0;color:var(--dim);font-size:12px;text-decoration:underline}
.linkbtn:hover{color:var(--gold)}
.goalline{font-size:14px;letter-spacing:.12em;color:var(--dim);margin-bottom:20px}
.ovbox li::before{content:"› ";color:var(--cyan)}
.bigbtn{padding:14px 34px;font-size:15px;font-weight:800;letter-spacing:.1em;border-radius:8px;background:#0c2a3f;border:1px solid var(--cyan);color:var(--cyan);text-shadow:0 0 8px var(--cyan);box-shadow:0 0 20px rgba(34,228,255,.25)}
.bigbtn:hover{background:#12405e}
.langsel{display:flex;gap:8px;justify-content:center;align-items:center;margin:0 0 18px;font-size:11px;letter-spacing:.15em;color:var(--dim)}
.langsel button{padding:6px 16px;border-radius:6px;background:#0b1a28;border:1px solid var(--line2);color:var(--dim);font-size:12px;letter-spacing:.05em}
.langsel button.on{border-color:var(--cyan);color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
.ovbox.over h1{color:var(--red);font-size:26px}
.ovbox.clear h1{color:var(--gold);font-size:26px;text-shadow:0 0 22px rgba(255,209,102,.6)}
.emblem{width:110px;height:110px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:48px;border:2px solid currentColor}
.ovbox.over .emblem{color:var(--red);box-shadow:0 0 30px rgba(255,45,85,.4)}
.ovbox.clear .emblem{color:var(--gold);box-shadow:0 0 40px rgba(255,209,102,.5);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.endstats{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;text-align:left;margin:16px auto 22px;max-width:420px;font-size:12px}
.endstats b{float:right;color:var(--text)}

/* ---------- 밸런스 튜너 ---------- */
#tuner{position:fixed;top:0;right:0;bottom:0;width:min(460px,96vw);background:rgba(6,13,21,.97);border-left:1px solid var(--line2);z-index:30;
  transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
#tuner.open{transform:none}
.tnote{margin:12px 0 4px;padding:10px 12px;border:1px solid #5a4a1d;background:#171204;border-radius:6px;color:#ffe3a3;font-size:12px;line-height:1.6}
.tnote b{color:var(--gold)}
.thead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.thead b{letter-spacing:.12em}
.tbtns{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.tbtns button,.thead button{background:#0d1d2d;border:1px solid var(--line2);border-radius:5px;padding:6px 10px;font-size:12px}
.tbtns button:hover{border-color:var(--cyan)}
.tbody{overflow:auto;padding:8px 16px 20px;flex:1}
.tsec{margin-top:12px;font-size:10px;letter-spacing:.2em;color:var(--cyan);border-bottom:1px solid var(--line);padding-bottom:4px}
.trow{display:grid;grid-template-columns:1fr 90px 74px;gap:8px;align-items:center;padding:4px 0}
.trow label{font-size:12px} .trow label small{display:block;font-size:9.5px;color:var(--dim)}
.trow input[type=number]{width:74px;background:#0a1826;border:1px solid var(--line2);color:var(--text);border-radius:4px;padding:3px 5px;font-family:inherit;font-size:12px}
.trow input.changed{border-color:var(--gold);color:var(--gold)}
#simOut{font-size:11.5px;line-height:1.55}
#simOut table{width:100%;border-collapse:collapse;margin-top:6px}
#simOut td,#simOut th{border-bottom:1px solid var(--line);padding:4px 3px;text-align:left;vertical-align:top}
#simOut th{color:var(--dim);font-weight:400;font-size:10px}
.ok{color:var(--green);font-weight:700} .ng{color:var(--red);font-weight:700}
.simbar{height:5px;background:#0d2033;border-radius:3px;overflow:hidden;margin:6px 0}
.simbar i{display:block;height:100%;width:0;background:var(--gold)}

/* ---------- 반응형 ---------- */
@media (max-width:1320px){ .brand{min-width:0} .brand .sub{display:none} .hstats{gap:14px} .ctrow{grid-template-columns:minmax(0,1fr) 190px} }
@media (max-width:1150px){ .stat.pop,.brand>div:last-child{display:none} #app{grid-template-columns:minmax(0,1fr) 290px} .ctnote{display:none} }
</style>
</head>
<body>
<div id="app">
  <!-- ================= 상단 헤더 ================= -->
  <header>
    <div class="brand">
      <div class="logo">◆</div>
      <div><div class="title">SELL THE PREDATOR</div><div class="sub">BREED &amp; BLEED · BIO-LAB MONITOR</div></div>
    </div>
    <div class="hstats">
      <div class="stat money" data-tip="money"><label data-i18n="hdr.money"></label><span id="hMoney">💰 $0</span></div>
      <div class="stat goal" data-tip="goal"><label id="hGoalLbl"></label><div class="goalbar"><i id="hGoalBar"></i></div><span id="hGoalPct">0%</span></div>
      <div class="stat" data-tip="time"><label data-i18n="hdr.time"></label><span id="hTime">00:00</span></div>
      <div class="stat" data-tip="upkeep"><label data-i18n="hdr.upkeep"></label><span id="hUpkeep" class="neg">-$0/s</span></div>
      <div class="stat pop" data-tip="pop"><label data-i18n="hdr.pop"></label><span><b class="g">● <i id="hP">0</i></b><b class="c">▲ <i id="hH">0</i></b><b class="r">◆ <i id="hC">0</i></b></span></div>
    </div>
    <div class="hctrl">
      <div class="speed" id="speedBtns" data-tip="speed"><button data-speed="1" class="on">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button></div>
    </div>
  </header>

  <!-- ================= 중앙 배양액 캔버스 ================= -->
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toasts"></div>
    <div id="guide" class="hidden"></div>
  </div>

  <!-- ================= 우측 바이오 마켓 ================= -->
  <aside id="market">
    <div class="ptitle">BIO-MARKET <span data-i18n="mk.sub"></span></div>
    <div class="cycle">
      <div class="row"><span data-i18n="mk.next"></span><span id="mTimer">15.0s</span></div>
      <div class="bar"><i id="mBar"></i></div>
      <div id="mEvent" class="event"></div>
    </div>
    <div class="card herb" id="cardH">
      <div class="row"><span class="nm"><b class="c">▲</b> <span data-i18n="sp.herb"></span></span><span class="hold" id="mHoldH"></span></div>
      <div class="price"><span id="mPriceH">$0</span><span id="mChgH" class="chg">—</span></div>
      <canvas class="spark" id="sparkH"></canvas>
      <div class="row small"><span id="mRangeH"></span></div>
      <div class="sellrow">
        <button class="sell herb" data-kind="herb" data-pct="0.3"></button>
        <button class="sell herb" data-kind="herb" data-pct="0.5"></button>
      </div>
    </div>
    <div class="card carn" id="cardC">
      <div class="row"><span class="nm"><b class="r">◆</b> <span data-i18n="sp.carn"></span></span><span class="hold" id="mHoldC"></span></div>

<script>
'use strict';
// ==SIM-START==
/* =====================================================================
   [1] 밸런스 설정 (GAME_CONFIG)
   - 명세서 4장의 어림값에서 출발해 Phase 6 헤드리스 봇 시뮬레이션으로 리밸런싱한 값
   ===================================================================== */
const GAME_CONFIG = {
  // 시작 자본 및 목표
  startMoney: 1800,                 // 초기 자금

  // 지수 > 1 이므로 개체가 늘수록 유지비가 가파르게 증가 — 초식 매도는 '유지비 벌이'용
  labUpkeepBase: 7,
  labUpkeepBiomassRate: 0.005,
  labUpkeepBiomassExp: 1.5,
  carnivoreBiomass: 6,              // 육식 1마리 = 초식 6마리분 생물량
  arrearsGraceSec: 30,              // 잔고 $0(유지비 체납) 상태가 이 시간 지속되면 파산

  // 마켓 시세 및 판매
  marketCycleSec: 15,               // 시세 변동 주기 (초)
  herbivorePriceMin: 4,
  herbivorePriceMax: 11,
  carnivorePriceMin: 220,
  carnivorePriceMax: 820,
  hotThreshold: 0.7,                // 정규화 시세(0~1)가 이 값 이상이면 '고점' (호가창 점멸)
  priceMomentum: 0.6,               // 직전 변동량을 이어받는 비율 (클수록 추세가 오래 지속)
  priceResistZone: 0.25,            // 상·하단 저항 구간 폭 (0.25 → 정규화 0.75 이상 / 0.25 이하)
  herbPriceVolatility: 0.07,        // 초식 시세 랜덤 충격 크기 (안정 자산)
  carnPriceVolatility: 0.12,        // 육식 시세 랜덤 충격 크기 (위험 자산)
  carnShockChance: 0.08,            // 사이클당 육식 급등(또는 폭락) 이벤트 확률
  harvestFee: 10,                   // 1회 매도 버튼 클릭 시 고정 수수료

  // 유료 개입
  spawnHerbivoreCost: 100,
  spawnHerbivoreCount: 10,
  spawnCarnivoreCost: 800,
  spawnCarnivoreCount: 2,
  emergencyFeedCost: 60,
  emergencyFeedCount: 20,

  // 컨테이너 — 업그레이드할수록 생물량 한도·식물 생성량 증가 (Lv1 + 업그레이드 5회)
  containerMaxLevel: 6,
  containerBaseCap: 90,             // Lv1 생물량 한도
  containerCapGrowth: 1.35,         // 레벨당 한도 배율   → 90, 122, 164, 221, 299, 404
  containerPlantBonus: 0.25,        // 레벨당 식물 생성량 +25%
  containerUpgradeCost: 800,        // Lv1→2 업그레이드 비용
  containerCostGrowth: 2.7,         // 레벨당 비용 배율   → 800, 2160, 5832, 15746, 42515
  overcrowdDeathRate: 0.6,          // 한도 초과 시 개체별 초당 사망 확률 = 계수 × 초과 비율
  containerMinArea: 0.4,            // Lv1 배양조 면적 비율 (최대 레벨에서 1.0 = 화면 전체)

  // 육식 보관함 — 생태계 밖에 보관 (먹지도·번식하지도·굶지도 않고 생물량에서 제외), 시세를 보고 매도
  storageBaseSlots: 8,              // Lv1 보관 칸
  storageSlotsPerLevel: 6,          // 레벨당 추가 칸 → 8, 14, 20, 26, 32, 38
  storageFeePerSec: 1,              // 보관 육식 1마리당 초당 보관료

  // 환경 레버 기본값 (0.0 ~ 1.0)
  defaultLight: 0.5,
  defaultTemp: 0.5,
  defaultNutrient: 0.5,
  lightHeatEffect: 0.3,             // 일조량이 실효 수온에 주는 부작용 계수 (레버 제거 후 기본값 고정)

  // 식물
  plantSpawnBaseRate: 5,             // 일조량 0.5일 때 초당 생성 개수
  plantEnergyBase: 26,              // 영양 0.5일 때 식물 1개 에너지
  plantMaxCap: 200,

  // 초식 세포
  herbivoreStartEnergy: 40,
  herbivoreReproduceThreshold: 65,
  herbivoreBaseSpeed: 40,
  herbivoreBaseMetabolism: 2.0,
  herbivoreSightRange: 80,
  herbivoreFleeRange: 60,           // 육식을 감지하고 도망치는 반경
  herbivoreMateRange: 60,           // 분열에 필요한 동족(정족수) 감지 반경 — Allee 효과
  herbivoreReproCooldown: 1.2,

  // 육식 세포
  carnivoreStartEnergy: 80,
  carnivoreReproduceThreshold: 180,
  carnivoreBaseSpeed: 55,
  carnivoreBaseMetabolism: 2.8,
  carnivoreSightRange: 150,
  carnivoreEnergyYield: 92,
  carnivoreMateRange: 180,
  carnivoreDigestTime: 1.0,         // 포식 후 소화 시간 (사냥 휴지기)
  carnivoreReproCooldown: 13,
  carnivoreSpacing: 70,             // 육식끼리 유지하려는 최소 간격 (영역성)

  // 시스템 한계
  maxHerbivores: 400,
  maxCarnivores: 150
};
const DEFAULT_CONFIG = JSON.parse(JSON.stringify(GAME_CONFIG));

const WORLD_W = 1200, WORLD_H = 760;   // 배양조 논리 좌표 (화면 크기와 무관하게 밸런스 고정)
const FIXED_DT = 1 / 60;               // 고정 시뮬레이션 스텝 (60FPS)

/* =====================================================================
   [2] 유틸리티 — 시드 난수, 가우시안, 공간 해시 그리드
   ===================================================================== */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Box-Muller 변환: 표준정규분포 난수
function gauss(rng) {
  let u = 0; while (u === 0) u = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng());
}

// 근접 탐색을 O(N)으로 줄이기 위한 균일 격자
class SpatialGrid {
  constructor(w, h, cs) {
    this.cs = cs; this.cols = Math.ceil(w / cs); this.rows = Math.ceil(h / cs);
    this.cells = [];
    for (let i = 0; i < this.cols * this.rows; i++) this.cells.push([]);
  }
  build(list) {
    for (let i = 0; i < this.cells.length; i++) this.cells[i].length = 0;
    for (let i = 0; i < list.length; i++) {
      const o = list[i]; if (o.dead) continue;
      const cx = clamp((o.x / this.cs) | 0, 0, this.cols - 1), cy = clamp((o.y / this.cs) | 0, 0, this.rows - 1);
      this.cells[cy * this.cols + cx].push(o);
    }
  }
  // 반경 r 이내 가장 가까운 개체
  nearest(x, y, r, skip) {
    const cs = this.cs;
    const x0 = Math.max(0, ((x - r) / cs) | 0), x1 = Math.min(this.cols - 1, ((x + r) / cs) | 0);
    const y0 = Math.max(0, ((y - r) / cs) | 0), y1 = Math.min(this.rows - 1, ((y + r) / cs) | 0);
    let best = null, bd = r * r;
    for (let cy = y0; cy <= y1; cy++) {
      const row = cy * this.cols;
      for (let cx = x0; cx <= x1; cx++) {
        const cell = this.cells[row + cx];
        for (let i = 0; i < cell.length; i++) {
          const o = cell[i]; if (o === skip || o.dead) continue;
          const dx = o.x - x, dy = o.y - y, d2 = dx * dx + dy * dy;
          if (d2 < bd) { bd = d2; best = o; }
        }
      }
    }
    return best;
  }
  // 반경 r 이내 모든 개체 (out 배열 재사용)
  neighbors(x, y, r, skip, out) {
    out.length = 0;
    const cs = this.cs, r2 = r * r;
    const x0 = Math.max(0, ((x - r) / cs) | 0), x1 = Math.min(this.cols - 1, ((x + r) / cs) | 0);
    const y0 = Math.max(0, ((y - r) / cs) | 0), y1 = Math.min(this.rows - 1, ((y + r) / cs) | 0);
    for (let cy = y0; cy <= y1; cy++) {
      const row = cy * this.cols;
      for (let cx = x0; cx <= x1; cx++) {
        const cell = this.cells[row + cx];
        for (let i = 0; i < cell.length; i++) {
          const o = cell[i]; if (o === skip || o.dead) continue;
          const dx = o.x - x, dy = o.y - y;
          if (dx * dx + dy * dy < r2) out.push(o);
        }
      }
    }
    return out;
  }
}

/* =====================================================================
   [3] 월드 상태 생성 & 환경 공식
   ===================================================================== */
// 생물량: 초식 1 + 육식 carnivoreBiomass 단위
function biomass(w) { return w.herbs.length + w.carns.length * w.cfg.carnivoreBiomass; }
// 연구소 유지비: 생물량에 초선형 비례 (사료·산소·폐기물 처리 비용이 규모에 따라 급증)
function upkeepRate(w) {
  const c = w.cfg;
  return c.labUpkeepBase + c.labUpkeepBiomassRate * Math.pow(biomass(w), c.labUpkeepBiomassExp) + w.stored * c.storageFeePerSec;
}
// 환경 레버 → 실제 생태 계수
function envFactors(w) {
  const c = w.cfg, e = w.env;
  // 실효 수온 = 수온 + (일조량 - 0.5) × 부작용 계수  (일조량이 높으면 물이 데워짐)
  const effTemp = clamp(e.temp + (e.light - 0.5) * c.lightHeatEffect, 0, 1);
  return {
    effTemp,
    speedMul: 0.55 + 0.9 * effTemp,                         // 이동 속도 배율 (0.55 ~ 1.45)
    metabMul: 0.35 + 1.3 * effTemp,                         // 대사량 배율   (0.35 ~ 1.65) — 속도보다 가파름
    plantRate: c.plantSpawnBaseRate * (e.light / 0.5) * plantMul(w), // 초당 식물 생성 = 기본값 × (일조량 / 0.5) × 컨테이너 보너스
    plantEnergy: c.plantEnergyBase * (0.3 + 1.4 * e.nutrient) // 식물 칼로리 = 기본값 × (0.3 ~ 1.7)
  };
}

let _uid = 1;
function makeAgent(w, x, y, e) {
  const a = w.rng() * Math.PI * 2;
  return { id: _uid++, x, y, vx: Math.cos(a) * 10, vy: Math.sin(a) * 10, e, cd: 1 + w.rng(), wa: a, hd: a, dg: 0, dead: false, bt: w.t };
}
// 컨테이너 공식: 한도 = 기본 × 성장^(Lv-1), 식물 배율 = 1 + 보너스 × (Lv-1), 비용 = 기본 × 성장^(Lv-1)
function containerCap(w, lv = w.level) { return Math.round(w.cfg.containerBaseCap * Math.pow(w.cfg.containerCapGrowth, lv - 1)); }
function plantMul(w, lv = w.level) { return 1 + w.cfg.containerPlantBonus * (lv - 1); }
// 배양조 실제 경계: 면적 = 최소 비율 → 1.0 (레벨에 선형 비례), 화면 중앙 정렬
function tankBounds(c, lv) {
  const f = c.containerMinArea + (1 - c.containerMinArea) * (lv - 1) / Math.max(1, c.containerMaxLevel - 1);
  const k = Math.sqrt(Math.min(1, f)), bw = WORLD_W * k, bh = WORLD_H * k;
  return { x0: (WORLD_W - bw) / 2, y0: (WORLD_H - bh) / 2, x1: (WORLD_W + bw) / 2, y1: (WORLD_H + bh) / 2 };
}
// 보관 칸 = 기본 + 레벨당 추가 × (Lv-1)
function storageCap(w) { return w.cfg.storageBaseSlots + w.cfg.storageSlotsPerLevel * (w.level - 1); }
function upgradeCost(w) { return w.level >= w.cfg.containerMaxLevel ? null : Math.round(w.cfg.containerUpgradeCost * Math.pow(w.cfg.containerCostGrowth, w.level - 1)); }
function addPlant(w, energy) {
  if (w.plants.length >= w.cfg.plantMaxCap * plantMul(w)) return false;
  const b = w.bounds;
  w.plants.push({ x: b.x0 + 15 + w.rng() * (b.x1 - b.x0 - 30), y: b.y0 + 15 + w.rng() * (b.y1 - b.y0 - 30), e: energy, dead: false, bt: w.t });
  return true;
}
function addHerbAt(w, x, y, e) { const h = makeAgent(w, x, y, e); w.herbs.push(h); return h; }
function addCarnAt(w, x, y, e) { const c = makeAgent(w, x, y, e); w.carns.push(c); return c; }

function createWorld(cfg, opts = {}) {
  const seed = opts.seed != null ? opts.seed : (Math.random() * 1e9) | 0;
  const w = {
    cfg, rng: mulberry32(seed), headless: !!opts.headless, t: 0, money: cfg.startMoney,
    plants: [], herbs: [], carns: [],
    env: { light: cfg.defaultLight, temp: cfg.defaultTemp, nutrient: cfg.defaultNutrient },
    plantAcc: 0,
    plantGrid: new SpatialGrid(WORLD_W, WORLD_H, 40),
    herbGrid: new SpatialGrid(WORLD_W, WORLD_H, 40),
    carnGrid: new SpatialGrid(WORLD_W, WORLD_H, 40),
    market: null, history: [], histAcc: 0,
    stats: { soldH: 0, soldC: 0, revenue: 0, fees: 0, upkeep: 0, spent: 0, bornH: 0, bornC: 0,
      starvedH: 0, starvedC: 0, eaten: 0, peakMoney: cfg.startMoney, herbExt: 0, carnExt: 0,
      maxH: 0, maxC: 0, crashes: 0, hPeak: 0, crowded: 0 },
    events: [], state: 'playing', endTime: 0, endReason: '', arrears: 0, marketTick: false, prevH: 0, prevC: 0,
    level: 1, crowdWarned: false, stored: 0, bounds: null
  };
  w.market = createMarket(w);
  w.bounds = tankBounds(cfg, 1);
  const F = envFactors(w);
  // 초기 생태계: 식물 20, 초식 10, 육식 0 (명세 5장)
  for (let i = 0; i < 20; i++) addPlant(w, F.plantEnergy);
  const nH = opts.herbs != null ? opts.herbs : 10, nC = opts.carns || 0;
  for (let i = 0; i < nH; i++) addHerbAt(w, WORLD_W / 2 + (w.rng() - .5) * 300, WORLD_H / 2 + (w.rng() - .5) * 200, cfg.herbivoreStartEnergy);
  for (let i = 0; i < nC; i++) addCarnAt(w, WORLD_W / 2 + (w.rng() - .5) * 200, WORLD_H / 2 + (w.rng() - .5) * 150, cfg.carnivoreStartEnergy);
  w.prevH = w.herbs.length; w.prevC = w.carns.length;
  return w;
}
function emit(w, ev) { if (!w.headless) w.events.push(ev); }

/* =====================================================================
   [4] 게임 루프 — Boids 조향, 포식 판정, 분열, 아사
   ===================================================================== */
const _nb = [];
// 벽 회피: 가장자리 margin 이내면 안쪽으로 밀어내는 희망 속도 (gain = 반발 강도)
function wallSteer(a, sp, out, bd, m = 40, gain = 1.5) {
  if (a.x < bd.x0 + m) out.x += (bd.x0 + m - a.x) / m * sp * gain; else if (a.x > bd.x1 - m) out.x -= (a.x - (bd.x1 - m)) / m * sp * gain;
  if (a.y < bd.y0 + m) out.y += (bd.y0 + m - a.y) / m * sp * gain; else if (a.y > bd.y1 - m) out.y -= (a.y - (bd.y1 - m)) / m * sp * gain;
}
// 벽 근처에서는 배회 방향(wa) 자체를 안쪽으로 회전시킴
// (배회 의지와 벽 반발력이 정면으로 상쇄되면 속도가 0 근처가 되어 방향을 못 정하고 떨리는 현상 방지)
function turnFromWall(a, bd, m, dt) {
  let nx = 0, ny = 0;
  if (a.x < bd.x0 + m) nx = 1; else if (a.x > bd.x1 - m) nx = -1;
  if (a.y < bd.y0 + m) ny = 1; else if (a.y > bd.y1 - m) ny = -1;
  if (!nx && !ny) return;
  if (Math.cos(a.wa) * nx + Math.sin(a.wa) * ny > 0.3) return;   // 이미 안쪽을 향하고 있음
  let d = Math.atan2(ny, nx) - a.wa;
  d = Math.atan2(Math.sin(d), Math.cos(d));                        // -π ~ π 로 정규화
  a.wa += clamp(d, -5 * dt, 5 * dt);                               // 초당 최대 5rad 회전
}
// 희망 속도(dv)로 부드럽게 조향 후 이동 적분
function integrate(a, dvx, dvy, lim, dt, bd) {
  const k = Math.min(1, 5 * dt);                // 조향 민감도 (관성)
  a.vx += (dvx - a.vx) * k; a.vy += (dvy - a.vy) * k;
  const sp = Math.hypot(a.vx, a.vy);
  if (sp > lim) { a.vx *= lim / sp; a.vy *= lim / sp; }
  a.x += a.vx * dt; a.y += a.vy * dt;
  // 벽에 닿으면 속도와 배회 방향을 함께 반사
  if (a.x < bd.x0 + 3) { a.x = bd.x0 + 3; a.vx = Math.abs(a.vx); a.wa = Math.PI - a.wa; } else if (a.x > bd.x1 - 3) { a.x = bd.x1 - 3; a.vx = -Math.abs(a.vx); a.wa = Math.PI - a.wa; }
  if (a.y < bd.y0 + 3) { a.y = bd.y0 + 3; a.vy = Math.abs(a.vy); a.wa = -a.wa; } else if (a.y > bd.y1 - 3) { a.y = bd.y1 - 3; a.vy = -Math.abs(a.vy); a.wa = -a.wa; }
  // 렌더링용 기수 방향: 충분히 움직일 때만 속도 방향으로 부드럽게 따라감 (저속 시 회전 떨림 방지)
  if (sp > 4) {
    let d = Math.atan2(a.vy, a.vx) - a.hd;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    a.hd += d * Math.min(1, 10 * dt);
  }
}
// Boids 3원칙: 분리(Separation) · 정렬(Alignment) · 응집(Cohesion)
function boids(a, grid, range, sepR, sp, wAlign, wCoh, out) {
  const nb = grid.neighbors(a.x, a.y, range, a, _nb);
  if (!nb.length) return 0;
  let sx = 0, sy = 0, ax = 0, ay = 0, cx = 0, cy = 0;
  for (let i = 0; i < nb.length; i++) {
    const o = nb[i], dx = a.x - o.x, dy = a.y - o.y, d2 = dx * dx + dy * dy + 0.01;
    if (d2 < sepR * sepR) { const d = Math.sqrt(d2); sx += dx / d * (sepR - d) / sepR; sy += dy / d * (sepR - d) / sepR; }
    ax += o.vx; ay += o.vy; cx += o.x; cy += o.y;
  }
  const n = nb.length;
  out.x += sx * sp * 1.6 + (ax / n - a.vx) * wAlign;
  cx = cx / n - a.x; cy = cy / n - a.y;
  const cd = Math.hypot(cx, cy) || 1;
  out.x += cx / cd * sp * wCoh; out.y += cy / cd * sp * wCoh;
  out.y += sy * sp * 1.6 + (ay / n - a.vy) * wAlign;
  return n;
}

const _dv = { x: 0, y: 0 };
function stepHerbivores(w, F, dt) {
  const c = w.cfg, list = w.herbs, rng = w.rng;
  const sp = c.herbivoreBaseSpeed * F.speedMul;            // 실제 최고 속도 = 기본 속도 × 수온 배율
  const metab = c.herbivoreBaseMetabolism * F.metabMul;    // 초당 에너지 소모 = 기본 대사량 × 수온 배율
  const thr = c.herbivoreReproduceThreshold, eCap = thr * 1.5;
  const born = [];
  for (let i = 0; i < list.length; i++) {
    const h = list[i]; if (h.dead) continue;
    _dv.x = 0; _dv.y = 0;
    let lim = sp;
    const threat = w.carns.length ? w.carnGrid.nearest(h.x, h.y, c.herbivoreFleeRange, null) : null;
    let food = null;
    if (threat) {
      // 도주: 포식자 반대 방향으로 전력 질주 (순간 가속 1.15배)
      const dx = h.x - threat.x, dy = h.y - threat.y, d = Math.hypot(dx, dy) || 1;
      _dv.x += dx / d * sp * 1.6; _dv.y += dy / d * sp * 1.6; lim = sp * 1.15;
      h.wa = Math.atan2(dy, dx);
    } else {
      food = w.plantGrid.nearest(h.x, h.y, c.herbivoreSightRange, null);
      if (food) {
        const dx = food.x - h.x, dy = food.y - h.y, d = Math.hypot(dx, dy) || 1;
        _dv.x += dx / d * sp; _dv.y += dy / d * sp; h.wa = Math.atan2(dy, dx);
      } else {
        // 배회: 방향을 천천히 무작위로 틀며 탐색
        h.wa += (rng() - 0.5) * 5 * dt;
        turnFromWall(h, w.bounds, 50, dt);
        _dv.x += Math.cos(h.wa) * sp * 0.75; _dv.y += Math.sin(h.wa) * sp * 0.75;
      }
    }
    boids(h, w.herbGrid, 36, 12, sp, 0.25, food ? 0.1 : 0.3, _dv);
    wallSteer(h, sp, _dv, w.bounds);
    integrate(h, _dv.x, _dv.y, lim, dt, w.bounds);

    // 섭취 판정
    if (food && !food.dead) {
      const dx = food.x - h.x, dy = food.y - h.y;
      if (dx * dx + dy * dy < 64) { food.dead = true; h.e = Math.min(eCap, h.e + food.e); }
    }
    // 대사 (아사 판정)
    h.e -= metab * dt; h.cd -= dt;
    if (h.e <= 0) { h.dead = true; w.stats.starvedH++; emit(w, { type: 'death', x: h.x, y: h.y, kind: 'herb' }); continue; }
    // 세포분열: 에너지 ≥ 임계치 + 쿨다운 종료 + 주변에 동족 존재(정족수 감지)
    if (h.e >= thr && h.cd <= 0 && list.length + born.length < c.maxHerbivores) {
      if (w.herbGrid.nearest(h.x, h.y, c.herbivoreMateRange, h)) {
        h.e *= 0.5; h.cd = c.herbivoreReproCooldown;
        const ch = makeAgent(w, h.x + (rng() - .5) * 6, h.y + (rng() - .5) * 6, h.e);
        ch.cd = c.herbivoreReproCooldown; ch.vx = -h.vx; ch.vy = -h.vy;
        born.push(ch); w.stats.bornH++;
        emit(w, { type: 'birth', x: h.x, y: h.y, kind: 'herb' });
      }
    }
  }
  for (let i = 0; i < born.length; i++) list.push(born[i]);
}

function stepCarnivores(w, F, dt) {
  const c = w.cfg, list = w.carns, rng = w.rng;
  const sp = c.carnivoreBaseSpeed * F.speedMul;
  const metab = c.carnivoreBaseMetabolism * F.metabMul;
  const thr = c.carnivoreReproduceThreshold, eCap = thr * 1.5;
  const born = [];
  for (let i = 0; i < list.length; i++) {
    const k = list[i]; if (k.dead) continue;
    _dv.x = 0; _dv.y = 0;
    let prey = null, lim = sp;
    k.dg -= dt;
    if (k.dg <= 0) prey = w.herbGrid.nearest(k.x, k.y, c.carnivoreSightRange, null);
    if (prey) {
      // 추격: 먹잇감의 0.3초 뒤 예측 위치를 향해 조향 (Pursuit)
      const tx = prey.x + prey.vx * 0.3, ty = prey.y + prey.vy * 0.3;
      const dx = tx - k.x, dy = ty - k.y, d = Math.hypot(dx, dy) || 1;
      _dv.x += dx / d * sp * 1.3; _dv.y += dy / d * sp * 1.3; k.wa = Math.atan2(dy, dx);
    } else {
      // 소화 중이거나 먹잇감 없음 → 독립 배회 (영역 사냥꾼)
      k.wa += (rng() - 0.5) * 4 * dt;
      turnFromWall(k, w.bounds, 70, dt);
      const slow = k.dg > 0 ? 0.45 : 0.8;
      _dv.x += Math.cos(k.wa) * sp * slow; _dv.y += Math.sin(k.wa) * sp * slow;
      // 짝 찾기: 번식 반경 안에 동족이 하나도 없을 때만 가장 가까운 동족 쪽으로 이동
      if (!w.carnGrid.nearest(k.x, k.y, c.carnivoreMateRange * 0.85, k)) {
        const mate = w.carnGrid.nearest(k.x, k.y, 520, k);
        if (mate) { const dx = mate.x - k.x, dy = mate.y - k.y, d = Math.hypot(dx, dy) || 1; _dv.x += dx / d * sp * 0.4; _dv.y += dy / d * sp * 0.4; }
      }
      if (k.dg > 0) lim = sp * 0.6;
    }
    // 영역성: 정렬·응집 없이 분리만 넓게 적용 → 육식끼리 서로 거리를 두고 퍼짐
    boids(k, w.carnGrid, c.carnivoreSpacing, c.carnivoreSpacing, sp * 0.7, 0, 0, _dv);
    // 추격 중에는 벽 반발을 약하게 (벽에 붙은 먹잇감 앞에서 멈칫거리지 않도록)
    wallSteer(k, sp, _dv, w.bounds, prey ? 25 : 60, prey ? 0.6 : 1.6);
    integrate(k, _dv.x, _dv.y, lim, dt, w.bounds);

    // 포식 판정: 접촉 시 초식 즉사, 고정 에너지 획득
    if (prey && !prey.dead) {
      const dx = prey.x - k.x, dy = prey.y - k.y;
      if (dx * dx + dy * dy < 100) {
        prey.dead = true; w.stats.eaten++;
        k.e = Math.min(eCap, k.e + c.carnivoreEnergyYield); k.dg = c.carnivoreDigestTime;
        emit(w, { type: 'kill', x: prey.x, y: prey.y });
      }
    }
    k.e -= metab * dt; k.cd -= dt;
    if (k.e <= 0) { k.dead = true; w.stats.starvedC++; emit(w, { type: 'death', x: k.x, y: k.y, kind: 'carn' }); continue; }
    if (k.e >= thr && k.cd <= 0 && list.length + born.length < c.maxCarnivores) {
      if (w.carnGrid.nearest(k.x, k.y, c.carnivoreMateRange, k)) {
        k.e *= 0.5; k.cd = c.carnivoreReproCooldown;
        const ch = makeAgent(w, k.x + (rng() - .5) * 8, k.y + (rng() - .5) * 8, k.e);
        ch.cd = c.carnivoreReproCooldown; ch.vx = -k.vx; ch.vy = -k.vy;
        born.push(ch); w.stats.bornC++;
        emit(w, { type: 'birth', x: k.x, y: k.y, kind: 'carn' });
      }
    }
  }
  for (let i = 0; i < born.length; i++) list.push(born[i]);
}

function stepWorld(w, dt) {
  if (w.state !== 'playing') return;
  const c = w.cfg, F = envFactors(w);
  w.t += dt;
  w.marketTick = false;

  // 식물 자연 생성: 누적기에 (초당 생성률 × dt)를 더하고 1 넘을 때마다 생성
  w.plantAcc += F.plantRate * dt;
  while (w.plantAcc >= 1) { w.plantAcc -= 1; addPlant(w, F.plantEnergy); }

  w.plantGrid.build(w.plants); w.herbGrid.build(w.herbs); w.carnGrid.build(w.carns);
  stepHerbivores(w, F, dt);
  stepCarnivores(w, F, dt);

  // 사망/섭취 개체 정리
  w.plants = w.plants.filter(p => !p.dead);
  w.herbs = w.herbs.filter(h => !h.dead);
  w.carns = w.carns.filter(k => !k.dead);
  overcrowd(w, dt);
  populationWatch(w);

  // 시세 타이머
  w.market.timer -= dt;
  if (w.market.timer <= 0) { w.market.timer += c.marketCycleSec; updateMarket(w); }

  // 연구소 유지비 (잔고는 0 밑으로 내려가지 않음)
  const up = Math.min(w.money, upkeepRate(w) * dt);
  w.money -= up; w.stats.upkeep += up;
  // 체납 타이머: 잔고가 바닥난 채로 유예 시간이 지나면 파산
  // $200 이상 회복해야 리셋 — 소액 매도로 잠깐 플러스가 되는 정도로는 천천히만 줄어듦
  if (w.money <= 0.001) w.arrears += dt;
  else if (w.money >= 200) w.arrears = 0;
  else w.arrears = Math.max(0, w.arrears - dt * 0.5);

  // 그래프 히스토리 (0.25초 간격, 최근 2분)
  w.histAcc += dt;
  if (w.histAcc >= 0.25) {
    w.histAcc -= 0.25;
    w.history.push({ h: w.herbs.length, c: w.carns.length, p: w.plants.length });
    if (w.history.length > 480) w.history.shift();
  }
  checkEnd(w);
}

// 과밀 사망: 생물량이 컨테이너 한도를 넘으면 모든 개체가 (계수 × 초과 비율 × dt) 확률로 무작위 사망
function overcrowd(w, dt) {
  const B = biomass(w), cap = containerCap(w);
  if (B <= cap) { if (B < cap * 0.9) w.crowdWarned = false; return; }
  const pDie = w.cfg.overcrowdDeathRate * (B / cap - 1) * dt;
  let died = 0;
  for (const list of [w.herbs, w.carns]) for (const o of list) {
    if (w.rng() < pDie) { o.dead = true; died++; emit(w, { type: 'death', x: o.x, y: o.y, kind: 'crowd' }); }
  }
  if (died) { w.stats.crowded += died; w.herbs = w.herbs.filter(o => !o.dead); w.carns = w.carns.filter(o => !o.dead); }
  if (!w.crowdWarned) { w.crowdWarned = true; emit(w, { type: 'toast', kind: 'bad', key: 'to.crowd' }); }
}

// 개체수 감시: 멸종·폭락 통계 및 경고 이벤트
function populationWatch(w) {
  const H = w.herbs.length, C = w.carns.length, s = w.stats;
  if (H > s.maxH) s.maxH = H; if (C > s.maxC) s.maxC = C;
  // 집단 아사(붕괴) 감지: 직전 고점(≥30) 대비 절반 이하로 떨어지면 1회
  if (H > s.hPeak) s.hPeak = H;
  else if (s.hPeak >= 30 && H < s.hPeak * 0.5) { s.crashes++; s.hPeak = H; }
  if (w.prevH > 0 && H === 0) { s.herbExt++; emit(w, { type: 'toast', kind: 'bad', key: 'to.herbExt' }); }
  if (w.prevC > 0 && C === 0) { s.carnExt++; emit(w, { type: 'toast', kind: 'bad', key: 'to.carnExt' }); }
  if (w.prevC >= 2 && C === 1) emit(w, { type: 'toast', kind: 'warn', key: 'to.carnLone' });
  if (w.prevH >= 2 && H === 1) emit(w, { type: 'toast', kind: 'warn', key: 'to.herbLone' });
  w.prevH = H; w.prevC = C;
}

function checkEnd(w) {
  if (w.state !== 'playing') return;
  if (w.money > w.stats.peakMoney) w.stats.peakMoney = w.money;
  if (w.money >= w.cfg.targetMoney) { w.state = 'clear'; w.endTime = w.t; }
  else if (w.herbs.length + w.carns.length === 0 && w.stored === 0 && w.money < w.cfg.spawnHerbivoreCost) { w.state = 'over'; w.endTime = w.t; w.endReason = 'extinct'; }
  else if (w.arrears >= w.cfg.arrearsGraceSec) { w.state = 'over'; w.endTime = w.t; w.endReason = 'arrears'; }
}

/* =====================================================================
   [5] 시세 변동 로직 (마켓)
   - 정규화 시세 p(0~1) → 실제 단가 = 최소 + p × (최대 - 최소)
   ===================================================================== */
function priceOf(c, kind, p) {
  return kind === 'herb'
    ? Math.round((c.herbivorePriceMin + p * (c.herbivorePriceMax - c.herbivorePriceMin)) * 10) / 10
    : Math.round(c.carnivorePriceMin + p * (c.carnivorePriceMax - c.carnivorePriceMin));
}
function createMarket(w) {
  const m = { timer: w.cfg.marketCycleSec, cycle: 0, event: 'open', eventKind: '',
    herb: { p: 0.5, v: 0, price: 0, prev: 0, hist: [] }, carn: { p: 0.35, v: 0, price: 0, prev: 0, hist: [] } };
  for (const k of ['herb', 'carn']) { const s = m[k]; s.price = s.prev = priceOf(w.cfg, k, s.p); s.hist.push(s.price); }
  return m;
}
function isHot(w, kind) { return w.market[kind].p >= w.cfg.hotThreshold; }
// 추세형 시세 한 걸음 (모멘텀 + 경계 저항)
// - 변동량 v = 직전 v × 모멘텀 + 랜덤 충격 → 오르던 시세는 다음에도 오를 확률이 높음
// - 상·하단 저항 구간에 들어가면 깊이(k: 0~1)에 비례해 같은 방향 이동을 줄이고 반대쪽으로 밀어냄
function stepPrice(s, c, rng, vol) {
  let v = s.v * c.priceMomentum + gauss(rng) * vol;
  const z = c.priceResistZone, hi = s.p - (1 - z), lo = z - s.p;
  if (hi > 0) { const k = Math.min(1, hi / z); if (v > 0) v *= 1 - 0.95 * k; v -= k * 0.15; }
  else if (lo > 0) { const k = Math.min(1, lo / z); if (v < 0) v *= 1 - 0.95 * k; v += k * 0.15; }
  s.v = v;
  s.p = clamp(s.p + v, 0, 1);
  if (s.p <= 0 || s.p >= 1) s.v *= -0.3;          // 끝에 닿으면 약하게 반동
}
function updateMarket(w) {
  const m = w.market, c = w.cfg, rng = w.rng, H = m.herb, C = m.carn;
  m.cycle++;
  H.prev = H.price; C.prev = C.price;
  // 초식: 작은 충격의 추세형 시세 (안정 자산)
  stepPrice(H, c, rng, c.herbPriceVolatility);
  // 육식: 큰 충격 + 급등/폭락 이벤트가 추세 자체를 꺾음 (위험 자산) — 효과가 여러 사이클에 걸쳐 이어짐
  const r = rng();
  m.eventKind = '';
  if (r < c.carnShockChance) { C.v = Math.max(C.v, 0) + 0.25 + rng() * 0.1; m.eventKind = 'spike'; }
  else if (r < c.carnShockChance * 2) { C.v = Math.min(C.v, 0) - 0.25 - rng() * 0.1; m.eventKind = 'crash'; }
  stepPrice(C, c, rng, c.carnPriceVolatility);
  m.event = m.eventKind || (C.v > 0.04 ? 'up' : C.v < -0.04 ? 'down' : 'normal');
  H.price = priceOf(c, 'herb', H.p); C.price = priceOf(c, 'carn', C.p);
  H.hist.push(H.price); C.hist.push(C.price);
  if (H.hist.length > 30) H.hist.shift(); if (C.hist.length > 30) C.hist.shift();
  w.marketTick = true;
  emit(w, { type: 'market' });
  if (m.eventKind === 'spike') emit(w, { type: 'toast', kind: 'bad', key: 'to.spike', p: { p: '$' + C.price } });
}

/* =====================================================================
   [6] 플레이어 액션 — 매도 / 유료 개입
   ===================================================================== */
function sellSpecies(w, kind, pct) {
  if (w.state !== 'playing') return null;
  const list = kind === 'herb' ? w.herbs : w.carns, n = list.length;
  if (n === 0) return null;
  const count = Math.min(n, Math.ceil(n * pct));          // N% 올림 (최소 1마리)
  const price = w.market[kind].price;
  const sold = removeRandom(w, kind, count);
  // 정산: 잔고 += 매도 수 × 현재 단가 − 고정 수수료
  const gross = count * price, fee = w.cfg.harvestFee;
  w.money = Math.max(0, w.money + gross - fee);
  w.stats.revenue += gross; w.stats.fees += fee;
  if (kind === 'herb') w.stats.soldH += count; else w.stats.soldC += count;
  emit(w, { type: 'sell', kind, sold, price, gross, fee, count });
  populationWatch(w);
  checkEnd(w);
  return { count, price, gross, fee };
}
// 부분 Fisher-Yates로 count마리를 무작위로 꺼내 제거하고 위치 목록 반환
function removeRandom(w, kind, count) {
  const list = kind === 'herb' ? w.herbs : w.carns, n = list.length;
  const idx = list.map((_, i) => i);
  for (let i = 0; i < count; i++) { const j = i + ((w.rng() * (n - i)) | 0); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  const out = [];
  for (let i = 0; i < count; i++) { const o = list[idx[i]]; o.dead = true; out.push({ x: o.x, y: o.y }); }
  if (kind === 'herb') w.herbs = list.filter(o => !o.dead); else w.carns = list.filter(o => !o.dead);
  return out;
}
// 보관: 배양조 육식의 N%(올림, 남은 칸 한도)를 보관함으로 이동
function storeCarnivores(w, pct) {
  if (w.state !== 'playing') return null;
  const n = w.carns.length, space = storageCap(w) - w.stored;
  if (!n || space <= 0) return null;
  const count = Math.min(space, n, Math.ceil(n * pct));
  const moved = removeRandom(w, 'carn', count);
  w.stored += count;
  emit(w, { type: 'store', moved, count });
  populationWatch(w);
  return count;
}
// 보관분 전량 매도: 매도 수 × 현재 육식 단가 − 고정 수수료
function sellStored(w) {
  if (w.state !== 'playing' || !w.stored) return null;
  const count = w.stored, price = w.market.carn.price, gross = count * price, fee = w.cfg.harvestFee;
  w.stored = 0;
  w.money = Math.max(0, w.money + gross - fee);
  w.stats.revenue += gross; w.stats.fees += fee; w.stats.soldC += count;
  emit(w, { type: 'sell', kind: 'carn', sold: [], stored: true, price, gross, fee, count });
  checkEnd(w);
  return { count, price, gross, fee };
}
function spawnHerbivores(w) {
  const c = w.cfg; if (w.state !== 'playing' || w.money < c.spawnHerbivoreCost) return false;
  w.money -= c.spawnHerbivoreCost; w.stats.spent += c.spawnHerbivoreCost;
  for (let i = 0; i < c.spawnHerbivoreCount; i++) addHerbAt(w, WORLD_W / 2 + (w.rng() - .5) * 60, WORLD_H / 2 + (w.rng() - .5) * 60, c.herbivoreStartEnergy);
  emit(w, { type: 'spawn', kind: 'herb' }); w.prevH = w.herbs.length; return true;
}
function spawnCarnivores(w) {
  const c = w.cfg; if (w.state !== 'playing' || w.money < c.spawnCarnivoreCost) return false;
  w.money -= c.spawnCarnivoreCost; w.stats.spent += c.spawnCarnivoreCost;
  for (let i = 0; i < c.spawnCarnivoreCount; i++) addCarnAt(w, WORLD_W / 2 + (w.rng() - .5) * 40, WORLD_H / 2 + (w.rng() - .5) * 40, c.carnivoreStartEnergy);
  emit(w, { type: 'spawn', kind: 'carn' }); w.prevC = w.carns.length; return true;
}
function upgradeContainer(w) {
  const cost = upgradeCost(w);
  if (w.state !== 'playing' || cost == null || w.money < cost) return false;
  w.money -= cost; w.stats.spent += cost; w.level++;
  w.bounds = tankBounds(w.cfg, w.level);
  emit(w, { type: 'upgrade', level: w.level, cap: containerCap(w) });
  return true;
}
function emergencyFeed(w) {
  const c = w.cfg; if (w.state !== 'playing' || w.money < c.emergencyFeedCost) return false;
  w.money -= c.emergencyFeedCost; w.stats.spent += c.emergencyFeedCost;
  const F = envFactors(w);
  for (let i = 0; i < c.emergencyFeedCount; i++) addPlant(w, F.plantEnergy);
  emit(w, { type: 'spawn', kind: 'plant' }); return true;
}

/* =====================================================================
   [7] 밸런스 검증 봇 (8장 전략) & 헤드리스 시뮬레이터
   ===================================================================== */
const BOTS = {
  greedy: {
    tick() {},
    // 고점이면 무조건 50% 매도, 스폰·업그레이드 없음
    market(w) { if (isHot(w, 'herb')) sellSpecies(w, 'herb', 0.5); if (isHot(w, 'carn')) sellSpecies(w, 'carn', 0.5); },
    pass(r) { return r.outcome === 'BANKRUPT' && r.time <= 600; }
  },
  hoarder: {
    // 컨테이너는 키우지만 판매는 하지 않음. 관상용으로 육식을 한 번 들여놓음
    tick(w) {
      const H = w.herbs.length;
      if (!w._bought && H > 30 && w.money >= w.cfg.spawnCarnivoreCost) { spawnCarnivores(w); w._bought = true; }
      if (w._bought) upgradeContainer(w);
    },
    market() {},
    pass(r) { return r.peakMoney <= r.startMoney + 1 && (r.crashes >= 1 || r.outcome === 'BANKRUPT'); }
  },
  eco: {
    tick(w) {
      const c = w.cfg, H = w.herbs.length, C = w.carns.length;
      const ratio = C > 0 ? H / C : 99;                 // 육식 1마리당 초식 수
      // 컨테이너: 생물량이 한도의 70%를 넘고 여유 자금이 있으면 업그레이드
      const cost = upgradeCost(w), B = biomass(w), cap = containerCap(w);
      if (cost != null && B > cap * 0.7 && C >= 4 && w.money >= cost * 1.2 + 300) upgradeContainer(w);
      // 과밀 방지: 한도 90% 이상이면 더 많이 차지한 쪽을 정리
      if (B > cap * 0.9) { if (H > C * c.carnivoreBiomass) sellSpecies(w, 'herb', 0.3); else { ecoStore(w, 6); if (biomass(w) > cap * 0.9) ecoSell(w, 'carn', 6); } }
      // 개입: 멸종 위기 시에만 지출
      if (H < 6 && w.money >= c.spawnHerbivoreCost + 20) spawnHerbivores(w);
      if (C < 2 && H >= 40 && w.money >= c.spawnCarnivoreCost) spawnCarnivores(w);
      // 육식 과밀(초식 대비)일 때 잉여분을 보관함으로(꽉 차면 매도) → 붕괴 방지
      if (C > 8 && ratio < 2.2) { ecoStore(w, 6); if (w.carns.length > 8) ecoSell(w, 'carn', 6); }
      if (H > 220) sellSpecies(w, 'herb', 0.3);
      // 현금 부족: 보관분 → 초식 순으로 팔아 유지비 충당 (체납 파산 방지)
      if (w.money < 250 && w.stored) sellStored(w);
      if (w.money < 250 && H > 25) sellSpecies(w, 'herb', 0.3);
    },
    market(w) {
      const C = w.carns.length;
      // 육식 고점: 보관분 전량 + 배양조 잉여분 매도 (고점이 아닐 때는 넘치는 개체만 보관 — tick에서 처리)
      const keep = Math.max(4, Math.round(C * 0.25));
      if (isHot(w, 'carn')) { sellStored(w); ecoSell(w, 'carn', keep); }
      if (isHot(w, 'herb') && w.herbs.length > 120) sellSpecies(w, 'herb', 0.3);
      // 번식 쌍이 없으면 초식을 팔아 육식 재투입 자금 마련
      if (C < 2 && w.herbs.length > 35) sellSpecies(w, 'herb', 0.3);
    },
    pass(r) { return r.outcome === 'CLEAR' && r.time <= 1200; }
  }
};
// 남길 종자 수(keep)를 지키는 선에서 보관(30%) 버튼을 반복 클릭
function ecoStore(w, keep) {
  for (let guard = 0; guard < 6; guard++) {
    const n = w.carns.length;
    if (n < 4 || n - Math.ceil(n * 0.3) < keep || !storeCarnivores(w, 0.3)) break;
  }
}
// 남길 종자 수(keep)를 지키는 선에서 50% / 30% 버튼을 반복 클릭
function ecoSell(w, kind, keep) {
  for (let guard = 0; guard < 6; guard++) {
    const n = (kind === 'herb' ? w.herbs : w.carns).length;
    if (n - Math.ceil(n * 0.5) >= keep && n >= 6) sellSpecies(w, kind, 0.5);
    else if (n - Math.ceil(n * 0.3) >= keep && n >= 4) sellSpecies(w, kind, 0.3);
    else break;
  }
}

// 제너레이터: UI를 멈추지 않도록 일정 스텝마다 진행률을 yield
function* simulateBot(botKey, cfg, seed, maxTime = 1200) {
  const w = createWorld(Object.assign({}, cfg), { seed, headless: true });
  const bot = BOTS[botKey];
  let tickAcc = 0, steps = 0;
  while (w.state === 'playing' && w.t < maxTime) {
    stepWorld(w, FIXED_DT);
    if (w.marketTick) bot.market(w);
    tickAcc += FIXED_DT;
    if (tickAcc >= 0.5) { tickAcc -= 0.5; bot.tick(w); }
    if (++steps % 600 === 0) yield w.t / maxTime;
  }
  const outcome = w.state === 'clear' ? 'CLEAR' : w.state === 'over' ? 'BANKRUPT' : 'TIMEOUT';
  const r = { bot: botKey, seed, outcome, time: w.state === 'playing' ? w.t : w.endTime, money: w.money,
    startMoney: cfg.startMoney, peakMoney: w.stats.peakMoney, ...w.stats, H: w.herbs.length, C: w.carns.length, level: w.level };
  r.pass = bot.pass(r);
  return r;
}
function runBotSync(botKey, cfg, seed, maxTime) {
  const g = simulateBot(botKey, cfg, seed, maxTime); let s;
  while (!(s = g.next()).done);
  return s.value;
}
// ==SIM-END==

// 번역 조회: 현재 언어 → 영어 → 키 순으로 대체
function t(key, p) {
  let s = I18N[LANG][key] ?? I18N.en[key] ?? key;
  if (p) s = s.replace(/\{(\w+)\}/g, (_, k) => p[k] ?? '');
  return s;
}

/* =====================================================================
   [8] UI 공통 — DOM 참조, 포맷터, 토스트
   ===================================================================== */
const $ = id => document.getElementById(id);
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const fmtP = (kind, v) => kind === 'herb' ? '$' + v.toFixed(1) : '$' + Math.round(v).toLocaleString('en-US');
const mmss = t => { t = Math.max(0, Math.floor(t)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };

function toast(msg, kind = '') {
  const box = $('toasts'), d = document.createElement('div');
  d.className = 'toast ' + kind; d.textContent = msg;
  box.appendChild(d);
  while (box.children.length > 5) box.removeChild(box.firstChild);
  setTimeout(() => { d.style.opacity = '0'; setTimeout(() => d.remove(), 500); }, 3800);
}

/* =====================================================================
   [9] 게임 상태 머신 — START_MENU → PLAYING → GAME_OVER / GAME_CLEAR
   ===================================================================== */
let world = null, demo = null, gameState = 'START_MENU', speed = 1, acc = 0, lastTs = performance.now();
let uiTimer = 0, tradeLog = [];
const effects = [];

function enterState(s) {
  gameState = s;
  const ov = $('overlay');
  if (s === 'START_MENU') {
    demo = createWorld(GAME_CONFIG, { herbs: 40, carns: 4, headless: true }); demo.money = 1e12;
    demo.level = GAME_CONFIG.containerMaxLevel; demo.bounds = tankBounds(GAME_CONFIG, demo.level);
    renderMenu();
  } else if (s === 'PLAYING') {
    world = createWorld(GAME_CONFIG);
    demo = null; acc = 0; effects.length = 0; tradeLog = [];
    $('toasts').innerHTML = ''; renderTradeLog();
    ov.className = 'hidden'; ov.innerHTML = '';
    drawSparks();
    startGuide();
    toast(t('to.start'), 'good');
  } else if (s === 'GAME_OVER' || s === 'GAME_CLEAR') {
    guide = null; renderGuide();
    const w = world, st = w.stats, over = s === 'GAME_OVER';
    const reason = !over ? t('end.clear', { t: mmss(w.endTime), v: fmt(w.cfg.targetMoney) })
      : w.endReason === 'arrears' ? t('end.arrears', { s: w.cfg.arrearsGraceSec })
      : t('end.extinct', { v: fmt(w.cfg.spawnHerbivoreCost) });
    ov.className = '';
    ov.innerHTML = `<div class="ovbox ${over ? 'over' : 'clear'}">
      <div class="emblem">${over ? '☠' : '✦'}</div>
      <h1>${over ? 'Ecosystem Collapsed &amp; Bankrupted' : 'Ecosystem Stabilized. Target Reached.'}</h1>
      <p style="margin-top:10px;color:var(--dim)">${reason}</p>
      <div class="endstats">
        <div>${t('end.time')} <b>${mmss(w.endTime)}</b></div><div>${t('end.money')} <b>${fmt(w.money)}</b></div>
        <div>${t('end.revenue')} <b>${fmt(st.revenue)}</b></div><div>${t('end.peak')} <b>${fmt(st.peakMoney)}</b></div>
        <div>${t('end.sold')} <b>${st.soldH} / ${st.soldC}</b></div><div>${t('end.costs')} <b>${fmt(st.fees + st.upkeep)}</b></div>
        <div>${t('end.spent')} <b>${fmt(st.spent)}</b></div><div>${t('end.max')} <b>${st.maxH} / ${st.maxC}</b></div>
        <div>${t('end.born')} <b>${st.bornH} / ${st.bornC}</b></div><div>${t('end.starved')} <b>${st.starvedH} / ${st.starvedC}</b></div>

function applyI18n() {

/* =====================================================================
   [10] 플레이어 입력 → 시뮬레이션 액션 연결
   ===================================================================== */
function doSell(kind, pct) {
  if (gameState !== 'PLAYING') return;
  const r = sellSpecies(world, kind, pct);
  if (!r) toast(t('to.noCells', { name: t(kind === 'herb' ? 'sp.herbs' : 'sp.carns') }), 'warn');
}
function doSpawn(kind) {
  if (gameState !== 'PLAYING') return;
  const ok = kind === 'herb' ? spawnHerbivores(world) : kind === 'carn' ? spawnCarnivores(world) : emergencyFeed(world);
  if (!ok) toast(t('to.noMoney'), 'warn');
}
function setSpeed(v) {
  speed = v;
  document.querySelectorAll('#speedBtns button').forEach(b => b.classList.toggle('on', +b.dataset.speed === v));
}
function doStore() {
  if (gameState !== 'PLAYING') return;
  if (storageCap(world) - world.stored <= 0) { toast(t('to.storeFull'), 'warn'); return; }
  if (!storeCarnivores(world, 0.3)) toast(t('to.noCells', { name: t('sp.carns') }), 'warn');
}
function doSellStored() { if (gameState === 'PLAYING') sellStored(world); }
function doUpgrade() {
  if (gameState !== 'PLAYING') return;
  if (upgradeCost(world) == null) return;
  if (!upgradeContainer(world)) toast(t('to.noMoney'), 'warn');
}

document.querySelectorAll('.sell').forEach(b => b.addEventListener('click', e => { doSell(b.dataset.kind, +b.dataset.pct); b.blur(); }));
$('bSpawnH').onclick = e => { doSpawn('herb'); e.currentTarget.blur(); };
$('bSpawnC').onclick = e => { doSpawn('carn'); e.currentTarget.blur(); };
$('bFeed').onclick = e => { doSpawn('plant'); e.currentTarget.blur(); };
$('bUpgrade').onclick = e => { doUpgrade(); e.currentTarget.blur(); };
$('bStore').onclick = e => { doStore(); e.currentTarget.blur(); };
$('bSellSt').onclick = e => { doSellStored(); e.currentTarget.blur(); };
document.querySelectorAll('#speedBtns button').forEach(b => b.addEventListener('click', () => { setSpeed(+b.dataset.speed); b.blur(); }));

// 키보드 단축키 (한글 IME 상태에서도 동작하도록 e.code 사용)
document.addEventListener('keydown', e => {
  if (e.code === 'Backquote') { e.preventDefault(); toggleTuner(); return; }
  if (e.target.closest && e.target.closest('#tuner')) { if (e.code === 'Escape') toggleTuner(); return; }
  if (e.code === 'Escape' && $('tuner').classList.contains('open')) { toggleTuner(); return; }
  if (gameState !== 'PLAYING') {
    if ((e.code === 'Enter' || e.code === 'Space') && $('overlay').querySelector('.bigbtn')) { e.preventDefault(); $('overlay').querySelector('.bigbtn').click(); }
    return;
  }
  const order = [1, 2, 4];
  switch (e.code) {
    case 'Digit1': case 'Numpad1': if (!e.repeat) doSell('herb', 0.3); break;
    case 'Digit2': case 'Numpad2': if (!e.repeat) doSell('carn', 0.3); break;
    case 'Digit3': case 'Numpad3': if (!e.repeat) doStore(); break;
    case 'Digit4': case 'Numpad4': if (!e.repeat) doSellStored(); break;
    case 'KeyU': if (!e.repeat) doUpgrade(); break;
    case 'KeyS': if (!e.repeat) doSpawn('plant'); break;
    case 'Equal': case 'NumpadAdd': setSpeed(order[Math.min(2, order.indexOf(speed) + 1)]); break;
    case 'Minus': case 'NumpadSubtract': setSpeed(order[Math.max(0, order.indexOf(speed) - 1)]); break;
  }
});

/* =====================================================================
   [11] 렌더링 — 배양조(Boids 개체), 이펙트, 로트카-볼테라 그래프
   ===================================================================== */
const cv = $('cv'), ctx = cv.getContext('2d');
let dpr = 1, cw = 0, ch = 0, view = { s: 1, ox: 0, oy: 0 };
function resize() {
  const r = $('stage').getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1); cw = r.width; ch = r.height;
  cv.width = Math.max(1, Math.round(cw * dpr)); cv.height = Math.max(1, Math.round(ch * dpr));
  for (const id of ['sparkH', 'sparkC']) { const c = $(id); c.width = Math.round(c.clientWidth * dpr); c.height = Math.round(c.clientHeight * dpr); }
  drawSparks();
}
window.addEventListener('resize', resize);

// 발광 스프라이트 (방사형 그라디언트를 미리 그려 drawImage로 재사용 — shadowBlur보다 훨씬 빠름)
function glowSprite(rgb, size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, `rgba(${rgb},0.6)`); gr.addColorStop(0.3, `rgba(${rgb},0.2)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const SPR = { plant: glowSprite('57,255,138', 64), herb: glowSprite('34,228,255', 64), carn: glowSprite('255,45,85', 96) };

function renderWorld(w, now) {
  const c = w.cfg;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#02060a'; ctx.fillRect(0, 0, cw, ch);
  const s = Math.min(cw / WORLD_W, ch / WORLD_H) * 0.985;
  view = { s, ox: (cw - WORLD_W * s) / 2, oy: (ch - WORLD_H * s) / 2 };
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * view.ox, dpr * view.oy);

  // 잠긴 영역 (업그레이드 전): 어두운 빗금
  ctx.fillStyle = '#03070b'; ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  ctx.strokeStyle = 'rgba(93,125,148,0.07)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = -WORLD_H; x < WORLD_W; x += 26) { ctx.moveTo(x, 0); ctx.lineTo(x + WORLD_H, WORLD_H); }
  ctx.stroke();
  // 실제 배양조: 화면 경계(vb)가 목표 경계(w.bounds)로 부드럽게 확장
  const tb = w.bounds;
  if (!w._vb) w._vb = { ...tb };
  const vb = w._vb;
  for (const k of ['x0', 'y0', 'x1', 'y1']) vb[k] += (tb[k] - vb[k]) * 0.06;
  const bw = vb.x1 - vb.x0, bh = vb.y1 - vb.y0;
  ctx.save();
  ctx.beginPath(); ctx.rect(vb.x0, vb.y0, bw, bh); ctx.clip();
  ctx.fillStyle = '#050A10'; ctx.fillRect(vb.x0, vb.y0, bw, bh);
  const amb = ctx.createRadialGradient(WORLD_W / 2, WORLD_H / 2, 50, WORLD_W / 2, WORLD_H / 2, bw * 0.7);
  amb.addColorStop(0, 'rgba(20,60,90,0.2)'); amb.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = amb; ctx.fillRect(vb.x0, vb.y0, bw, bh);
  ctx.strokeStyle = 'rgba(34,228,255,0.05)'; ctx.beginPath();
  for (let x = 60; x < WORLD_W; x += 60) { ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_H); }
  for (let y = 60; y < WORLD_H; y += 60) { ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); }
  ctx.stroke();
  ctx.restore();
  // 컨테이너 외곽: 레벨이 오를수록 두껍게, 과밀이면 붉게 맥동
  const crowded = biomass(w) > containerCap(w);
  ctx.strokeStyle = crowded ? `rgba(255,45,85,${0.45 + 0.35 * Math.sin(now * 8)})` : 'rgba(34,228,255,0.35)';
  ctx.lineWidth = 1 + w.level; ctx.strokeRect(vb.x0, vb.y0, bw, bh);
  ctx.fillStyle = crowded ? 'rgba(255,90,110,0.85)' : 'rgba(93,125,148,0.7)'; ctx.font = '12px Consolas, monospace';
  ctx.fillText(`CONTAINER Lv${w.level} // CAP ${containerCap(w)}`, vb.x0 + 10, vb.y1 - 10);

  // 1) 발광 레이어 (가산 합성)
  ctx.globalCompositeOperation = 'lighter';
  for (const p of w.plants) { const k = Math.min(1, (w.t - p.bt) * 4); ctx.drawImage(SPR.plant, p.x - 10 * k, p.y - 10 * k, 20 * k, 20 * k); }
  for (const h of w.herbs) ctx.drawImage(SPR.herb, h.x - 13, h.y - 13, 26, 26);
  for (const k of w.carns) { const g = k.dg > 0 ? 54 : 42; ctx.drawImage(SPR.carn, k.x - g / 2, k.y - g / 2, g, g); }
  ctx.globalCompositeOperation = 'source-over';

  // 2) 식물: 녹색 원 (칼로리가 클수록 큼)
  ctx.fillStyle = '#39ff8a'; ctx.beginPath();
  for (const p of w.plants) {
    const k = Math.min(1, (w.t - p.bt) * 4), r = (1.4 + clamp(p.e / c.plantEnergyBase, 0.3, 1.8) * 1.2) * k;
    ctx.moveTo(p.x + r, p.y); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  }
  ctx.fill();

  // 3) 초식: 시안 삼각형 (이동 방향으로 회전, 에너지에 비례해 크기 변화, 굶주리면 깜빡임)
  const hThr = c.herbivoreReproduceThreshold;
  ctx.strokeStyle = 'rgba(200,250,255,0.8)'; ctx.lineWidth = 0.8;
  for (const h of w.herbs) {
    const a = h.hd, ca = Math.cos(a), sa = Math.sin(a);
    const r = (3.4 + Math.min(1.2, h.e / hThr) * 2.2) * Math.min(1, 0.4 + (w.t - h.bt) * 3);
    const bx = h.x - ca * r, by = h.y - sa * r;
    ctx.globalAlpha = h.e < hThr * 0.12 ? 0.35 + 0.3 * Math.sin(now * 14 + h.id) : 0.95;
    ctx.fillStyle = '#22e4ff';
    ctx.beginPath();
    ctx.moveTo(h.x + ca * r * 1.7, h.y + sa * r * 1.7);
    ctx.lineTo(bx - sa * r * 0.95, by + ca * r * 0.95);
    ctx.lineTo(bx + sa * r * 0.95, by - ca * r * 0.95);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 4) 육식: 크림슨 마름모 (이동 방향으로 회전, 소화 중이면 백색 코어)
  const cThr = c.carnivoreReproduceThreshold, few = w.carns.length <= 3;
  for (const k of w.carns) {
    const a = k.hd, ca = Math.cos(a), sa = Math.sin(a);
    const r = (5 + Math.min(1.2, k.e / cThr) * 3) * Math.min(1, 0.4 + (w.t - k.bt) * 3);
    ctx.globalAlpha = k.e < cThr * 0.12 ? 0.35 + 0.35 * Math.sin(now * 12 + k.id) : 1;
    ctx.fillStyle = '#ff2d55'; ctx.strokeStyle = 'rgba(255,190,205,0.9)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(k.x + ca * r * 1.8, k.y + sa * r * 1.8);
    ctx.lineTo(k.x - sa * r * 0.85, k.y + ca * r * 0.85);
    ctx.lineTo(k.x - ca * r * 1.1, k.y - sa * r * 1.1);
    ctx.lineTo(k.x + sa * r * 0.85, k.y - ca * r * 0.85);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    if (k.dg > 0) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(k.x, k.y, 1.8, 0, Math.PI * 2); ctx.fill(); }
    // 개체수가 적으면 번식 가능 반경(정족수)을 표시 — MVP 경고
    if (few) {
      ctx.globalAlpha = 0.35; ctx.setLineDash([4, 6]); ctx.strokeStyle = '#ff2d55';
      ctx.beginPath(); ctx.arc(k.x, k.y, c.carnivoreMateRange, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  ctx.globalAlpha = 1;
}

// 이펙트: 링(분열/아사/포식/스폰) + 플로팅 텍스트(매도 금액)
function pushFx(fx) { effects.push(fx); if (effects.length > 420) effects.splice(0, effects.length - 420); }
function processEvents(w) {
  for (const e of w.events) {
    switch (e.type) {
      case 'birth': pushFx({ k: 'ring', x: e.x, y: e.y, r0: 2, r1: e.kind === 'carn' ? 22 : 12, life: 0.5, t: 0, col: e.kind === 'carn' ? '255,45,85' : '34,228,255' }); break;
      case 'store':
        e.moved.forEach(p => pushFx({ k: 'ring', x: p.x, y: p.y, r0: 14, r1: 2, life: 0.6, t: 0, col: '120,220,255' })); break;
      case 'death': pushFx({ k: 'ring', x: e.x, y: e.y, r0: 8, r1: 1, life: 0.8, t: 0, col: e.kind === 'crowd' ? '255,140,60' : '120,140,155' }); break;
      case 'upgrade':
        pushFx({ k: 'ring', x: WORLD_W / 2, y: WORLD_H / 2, r0: 20, r1: 500, life: 1.2, t: 0, col: '255,209,102' });
        toast(t('to.upgrade', { l: e.level, cap: e.cap }), 'good'); break;
      case 'kill': pushFx({ k: 'ring', x: e.x, y: e.y, r0: 3, r1: 16, life: 0.35, t: 0, col: '255,120,140' }); break;
      case 'spawn': pushFx({ k: 'ring', x: WORLD_W / 2, y: WORLD_H / 2, r0: 10, r1: e.kind === 'plant' ? 400 : 90, life: 0.8, t: 0, col: e.kind === 'carn' ? '255,45,85' : e.kind === 'herb' ? '34,228,255' : '57,255,138' }); break;
      case 'market': drawSparks(); break;
      case 'toast': toast(t(e.key, e.p), e.kind); break;
      case 'sell': onSellFx(e); break;
    }
  }
  w.events.length = 0;
}
function onSellFx(e) {
  const col = e.kind === 'herb' ? '#9ff3ff' : '#ffd166', txt = '+' + fmtP(e.kind, e.price);
  e.sold.forEach((p, i) => {
    if (i < 40) pushFx({ k: 'text', x: p.x, y: p.y, text: txt, col, big: e.kind === 'carn', life: 1.5, t: -i * 0.02 });
    pushFx({ k: 'ring', x: p.x, y: p.y, r0: 2, r1: 18, life: 0.5, t: 0, col: '255,209,102' });
  });
  if (e.stored) pushFx({ k: 'text', x: WORLD_W / 2, y: WORLD_H / 2, text: `🧊 ${e.count} × ${txt}`, col, big: true, life: 2, t: 0 });
  const net = e.gross - e.fee;
  tradeLog.unshift(t('mk.log', { time: mmss(world.t), sym: t(e.kind === 'herb' ? 'log.herb' : 'log.carn') + (e.stored ? '🧊' : ''), n: e.count, p: fmtP(e.kind, e.price), g: fmt(e.gross), f: fmt(e.fee) }));
  tradeLog.length = Math.min(tradeLog.length, 5); renderTradeLog();
  const m = $('hMoney'); m.classList.remove('flash-up'); void m.offsetWidth; m.classList.add('flash-up');
  if (e.kind === 'carn' && net >= 1000) toast(t('to.bigSale', { n: e.count, v: fmt(net) }), 'good');
}
function renderTradeLog() {
  $('tradeLog').innerHTML = tradeLog.length ? tradeLog.map(x => `<div>${x}</div>`).join('') : `<div>${t('mk.noTrades')}</div>`;
}
function renderEffects(rdt) {
  const s = view.s;
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * view.ox, dpr * view.oy);
  ctx.textAlign = 'center';
  for (let i = effects.length - 1; i >= 0; i--) {
    const f = effects[i]; f.t += rdt;
    if (f.t >= f.life) { effects.splice(i, 1); continue; }
    if (f.t < 0) continue;
    const u = f.t / f.life;
    if (f.k === 'ring') {
      ctx.strokeStyle = `rgba(${f.col},${(1 - u) * 0.8})`; ctx.lineWidth = 1.5 / s;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * u, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.globalAlpha = u < 0.75 ? 1 : (1 - u) * 4;
      ctx.font = `bold ${(f.big ? 17 : 12) / s}px Consolas, monospace`;
      ctx.fillStyle = '#000'; ctx.fillText(f.text, f.x + 1 / s, f.y - u * 40 + 1 / s);
      ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y - u * 40);
      ctx.globalAlpha = 1;
    }
  }
  ctx.textAlign = 'left';
}

// 로트카-볼테라 실시간 그래프 (캔버스 우측 상단 반투명 오버레이)
function niceMax(v) { const steps = [5, 10, 20, 25, 50, 100, 150, 200, 250, 300, 400, 500]; for (const s of steps) if (v <= s) return s; return Math.ceil(v / 100) * 100; }
function renderGraph(w) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gw = Math.min(380, cw * 0.42), gh = Math.min(160, ch * 0.32), gx = cw - gw - 12, gy = 12;
  ctx.fillStyle = 'rgba(4,10,16,0.78)'; ctx.strokeStyle = 'rgba(34,228,255,0.28)'; ctx.lineWidth = 1;
  ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(gx, gy, gw, gh, 6); else ctx.rect(gx, gy, gw, gh); ctx.fill(); ctx.stroke();
  ctx.font = '10px Consolas, monospace'; ctx.fillStyle = 'rgba(160,190,210,0.75)';
  ctx.fillText(t('gr.title'), gx + 10, gy + 15);
  const H = w.herbs.length, C = w.carns.length;
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff2d55'; ctx.fillText('◆ ' + C, gx + gw - 10, gy + 15);
  ctx.fillStyle = '#22e4ff'; ctx.fillText('▲ ' + H, gx + gw - 52, gy + 15);
  ctx.fillStyle = 'rgba(57,255,138,0.8)'; ctx.fillText('● ' + w.plants.length, gx + gw - 98, gy + 15);
  ctx.textAlign = 'left';

  const px = gx + 30, py = gy + 24, pw = gw - 60, ph = gh - 36, hist = w.history, N = 480;
  let mh = 0, mc = 0;
  for (const d of hist) { if (d.h > mh) mh = d.h; if (d.c > mc) mc = d.c; }
  const hMax = niceMax(Math.max(20, mh * 1.1)), cMax = niceMax(Math.max(5, mc * 1.1));
  ctx.strokeStyle = 'rgba(34,228,255,0.08)'; ctx.beginPath();
  for (let i = 0; i <= 4; i++) { const y = py + ph * i / 4; ctx.moveTo(px, y); ctx.lineTo(px + pw, y); }
  ctx.stroke();
  ctx.fillStyle = '#22e4ff'; ctx.fillText(hMax, gx + 6, py + 8); ctx.fillText('0', gx + 6, py + ph);
  ctx.fillStyle = '#ff2d55'; ctx.textAlign = 'right'; ctx.fillText(cMax, gx + gw - 6, py + 8); ctx.fillText('0', gx + gw - 6, py + ph); ctx.textAlign = 'left';
  if (hist.length < 2) return;
  const x0 = px + pw * (1 - (hist.length - 1) / (N - 1)), dx = pw / (N - 1);
  // 식물 (식물 상한 기준 면적)
  ctx.fillStyle = 'rgba(57,255,138,0.10)'; ctx.beginPath(); ctx.moveTo(x0, py + ph);
  hist.forEach((d, i) => ctx.lineTo(x0 + i * dx, py + ph - ph * Math.min(1, d.p / w.cfg.plantMaxCap)));
  ctx.lineTo(x0 + (hist.length - 1) * dx, py + ph); ctx.fill();
  // 초식 / 육식 파동 곡선
  const line = (key, max, col) => {
    ctx.strokeStyle = col; ctx.lineWidth = 1.8; ctx.shadowColor = col; ctx.shadowBlur = 6; ctx.beginPath();
    hist.forEach((d, i) => { const y = py + ph - ph * Math.min(1, d[key] / max); i ? ctx.lineTo(x0 + i * dx, y) : ctx.moveTo(x0, y); });
    ctx.stroke(); ctx.shadowBlur = 0;
  };
  line('h', hMax, '#22e4ff'); line('c', cMax, '#ff2d55');
}

// 호가창 스파크라인 (최근 30회 시세)
function drawSparks() {
  const w = world || demo; if (!w) return;
  const c = w.cfg;
  sparkline($('sparkH'), w.market.herb.hist, '#22e4ff', c.herbivorePriceMin, c.herbivorePriceMax);
  sparkline($('sparkC'), w.market.carn.hist, '#ff2d55', c.carnivorePriceMin, c.carnivorePriceMax);
}
function sparkline(cnv, hist, col, lo, hi) {
  const g = cnv.getContext('2d'), W = cnv.width, Hh = cnv.height;
  g.clearRect(0, 0, W, Hh);
  const hotY = Hh - Hh * GAME_CONFIG.hotThreshold;
  g.strokeStyle = 'rgba(255,45,85,0.3)'; g.setLineDash([3 * dpr, 3 * dpr]); g.beginPath(); g.moveTo(0, hotY); g.lineTo(W, hotY); g.stroke(); g.setLineDash([]);
  if (hist.length < 2) return;
  const dx = W / 29, x0 = W - (hist.length - 1) * dx;
  g.strokeStyle = col; g.lineWidth = 1.5 * dpr; g.beginPath();
  hist.forEach((v, i) => { const y = Hh - 2 - (Hh - 4) * clamp((v - lo) / (hi - lo || 1), 0, 1); i ? g.lineTo(x0 + i * dx, y) : g.moveTo(x0, y); });
  g.stroke();
}

/* =====================================================================
   [12-0] 헤더 툴팁 — 마우스를 올린 동안 10Hz로 실시간 수치 갱신

    return t('tip.upkeep', { cb: c.carnivoreBiomass, base: fmt2(c.labUpkeepBase), rate: c.labUpkeepBiomassRate, B: biomass(w), exp: c.labUpkeepBiomassExp,

/* =====================================================================
   [12-1] 초반 플레이 가이드 — 게임 상태를 보고 단계가 자동으로 넘어감 (완료/건너뛰기 후 다시 표시 안 함)
   ===================================================================== */
const GUIDE_HERBS = 30;   // 육식 투입을 권하는 초식 수 (Eco-Trader 봇 기준)
const GUIDE_CARNS = 7;    // 첫 매도를 권하는 육식 수 (30% 매도 시 3마리 팔고 4마리 남음)
const GUIDE_STEPS = [
  { key: 'g.carn', target: () => $('bSpawnC'), done: w => w.carns.length > 0,
    params: w => ({ h: Math.min(w.herbs.length, GUIDE_HERBS), n: GUIDE_HERBS, v: fmt(w.cfg.spawnCarnivoreCost) }) },
  { key: 'g.sell', done: w => w.stats.soldC > 0,
    target: w => w.carns.length >= GUIDE_CARNS ? (isHot(w, 'carn') ? document.querySelector('.sell.carn[data-pct="0.3"]') : $('bStore')) : $('cardC'),
    params: w => ({ c: w.carns.length, n: GUIDE_CARNS }) },
  { key: 'g.box', target: () => $('bUpgrade'), done: (w, g) => w.level >= 2 || g.age > 45,
    params: w => ({ v: fmt(upgradeCost(w) || 0) }) },
  { key: 'g.end', target: null, done: (w, g) => g.age > 10 }
];
let guide = null, guideTick = 0;   // { i: 현재 단계, age: 단계 경과(실시간 초) }
function guideSeen() {
  try { return localStorage.getItem('stp.guide') === '1'; } catch (e) { return false; }
}
function startGuide() {
  guide = guideSeen() ? null : { i: 0, age: 0 };
  renderGuide();
}
