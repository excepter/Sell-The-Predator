  guide = null;
  try { localStorage.setItem('stp.guide', '1'); } catch (e) {}
  renderGuide();
}
function updateGuide(rdt) {
  if (!guide || gameState !== 'PLAYING') return;
  guide.age += rdt;
  if (GUIDE_STEPS[guide.i].done(world, guide)) {
    guide.i++; guide.age = 0;
    if (guide.i >= GUIDE_STEPS.length) { endGuide(); return; }
    renderGuide();
  } else if ((guideTick += rdt) > 0.5) { guideTick = 0; renderGuideText(); }   // 진행 수치만 갱신
}
function renderGuideText() {
  const st = GUIDE_STEPS[guide.i], el = $('gText');
  if (el) el.innerHTML = t(st.key, st.params ? st.params(world) : null);
  // 강조 대상은 상황에 따라 바뀔 수 있으므로 매번 다시 지정
  const tg = st.target ? st.target(world) : null;
  document.querySelectorAll('.guide-hi').forEach(e => { if (e !== tg) e.classList.remove('guide-hi'); });
  if (tg) tg.classList.add('guide-hi');
}
function renderGuide() {
  const el = $('guide');
  document.querySelectorAll('.guide-hi').forEach(e => e.classList.remove('guide-hi'));
  if (!guide) { el.className = 'hidden'; el.innerHTML = ''; return; }
  const st = GUIDE_STEPS[guide.i];
  el.className = '';
  el.innerHTML = `<div class="gstep"><span>${t('g.title')} ${guide.i + 1}/${GUIDE_STEPS.length}</span><button id="gSkip">${t('g.skip')}</button></div>
    <div id="gText"></div>`;
  renderGuideText();
  $('gSkip').onclick = e => { endGuide(); e.currentTarget.blur(); };
}

/* =====================================================================
   [13] 메인 루프 — 고정 스텝 누적기 × 배속
   ===================================================================== */
function frame(ts) {
  const rdt = Math.min(0.1, (ts - lastTs) / 1000); lastTs = ts;
  if (gameState === 'PLAYING') {
    // 배속: 실제 경과 시간 × speed 만큼 고정 스텝(1/60초)을 소화 → 이동·시세 타이머 모두 N배
    acc += rdt * speed;
    let n = 0;
    while (acc >= FIXED_DT && n < 30) { stepWorld(world, FIXED_DT); acc -= FIXED_DT; n++; if (world.state !== 'playing') break; }
    if (n >= 30) acc = 0;
    processEvents(world);
    if (world.state === 'over') enterState('GAME_OVER');
    else if (world.state === 'clear') enterState('GAME_CLEAR');
  } else if (gameState === 'START_MENU' && demo) {
    // 메뉴 배경 데모: 적당히 개체를 보충하며 계속 굴림
    stepWorld(demo, FIXED_DT);
    if (demo.herbs.length < 8) for (let i = 0; i < 10; i++) addHerbAt(demo, demo.rng() * WORLD_W, demo.rng() * WORLD_H, 40);
    if (demo.carns.length < 2) addCarnAt(demo, demo.rng() * WORLD_W, demo.rng() * WORLD_H, 100);
    if (demo.carns.length > 30) demo.carns.length = 20;
  }
  const w = gameState === 'START_MENU' ? demo : world;
  if (w) {
    renderWorld(w, ts / 1000);
    renderEffects(rdt);
    if (gameState !== 'START_MENU') renderGraph(w);
  }
  updateGuide(rdt);
  uiTimer += rdt;
  if (world && uiTimer > 0.1) { uiTimer = 0; updateUI(); if (tipTarget) renderTip(); }
  requestAnimationFrame(frame);
}

/* =====================================================================
   [14] 밸런스 튜너 (인스펙터) — 실시간 수정 / 코드 복사 / 봇 시뮬레이션
   ===================================================================== */
// [섹션 키, [[설정 키, 재시작 시 적용 여부]...]] — 표시 문구는 I18N의 'sec.*' / 'cfg.*'
const CFG_META = [
  ['economy', [['startMoney', 1], ['targetMoney'], ['labUpkeepBase'], ['labUpkeepBiomassRate'], ['labUpkeepBiomassExp'], ['carnivoreBiomass'], ['arrearsGraceSec']]],
  ['market', [['marketCycleSec'], ['herbivorePriceMin'], ['herbivorePriceMax'], ['carnivorePriceMin'], ['carnivorePriceMax'], ['hotThreshold'], ['priceMomentum'], ['priceResistZone'], ['herbPriceVolatility'], ['carnPriceVolatility'], ['carnShockChance'], ['harvestFee']]],
  ['actions', [['spawnHerbivoreCost'], ['spawnHerbivoreCount'], ['spawnCarnivoreCost'], ['spawnCarnivoreCount'], ['emergencyFeedCost'], ['emergencyFeedCount']]],
  ['container', [['containerMaxLevel'], ['containerBaseCap'], ['containerCapGrowth'], ['containerPlantBonus'], ['containerUpgradeCost'], ['containerCostGrowth'], ['overcrowdDeathRate'], ['containerMinArea', 1], ['storageBaseSlots'], ['storageSlotsPerLevel'], ['storageFeePerSec']]],
  ['env', [['defaultLight', 1], ['defaultTemp', 1], ['defaultNutrient', 1], ['lightHeatEffect']]],
  ['plant', [['plantSpawnBaseRate'], ['plantEnergyBase'], ['plantMaxCap']]],
  ['herb', [['herbivoreStartEnergy'], ['herbivoreReproduceThreshold'], ['herbivoreBaseSpeed'], ['herbivoreBaseMetabolism'], ['herbivoreSightRange'], ['herbivoreFleeRange'], ['herbivoreMateRange'], ['herbivoreReproCooldown']]],
  ['carn', [['carnivoreStartEnergy'], ['carnivoreReproduceThreshold'], ['carnivoreBaseSpeed'], ['carnivoreBaseMetabolism'], ['carnivoreSightRange'], ['carnivoreEnergyYield'], ['carnivoreMateRange'], ['carnivoreDigestTime'], ['carnivoreReproCooldown'], ['carnivoreSpacing']]],
  ['system', [['maxHerbivores'], ['maxCarnivores']]]
];
function buildTuner() {
  let html = '';
  for (const [sec, rows] of CFG_META) {
    html += `<div class="tsec">${t('sec.' + sec)}</div>`;
    for (const [k, restart] of rows) {
      const d = DEFAULT_CONFIG[k], unit = d <= 1 && !Number.isInteger(d) ? 1 : 0;
      const max = unit ? 1 : Math.max(1, d * 3), step = unit || d < 10 ? 0.05 : 1;
      html += `<div class="trow"><label>${t('cfg.' + k)}<small>${k}${restart ? ' · ' + t('tu.restartNote') : ''}</small></label>
        <input type="range" data-k="${k}" min="0" max="${max}" step="${step}" value="${GAME_CONFIG[k]}">
        <input type="number" data-k="${k}" step="${step}" value="${GAME_CONFIG[k]}"></div>`;
    }
  }
  $('tFields').innerHTML = html;
  $('tFields').querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => {
    const k = inp.dataset.k, v = parseFloat(inp.value);
    if (!isFinite(v)) return;
    GAME_CONFIG[k] = v;
    $('tFields').querySelectorAll(`input[data-k="${k}"]`).forEach(o => { if (o !== inp) o.value = v; o.classList.toggle('changed', v !== DEFAULT_CONFIG[k]); });
    if (k === 'hotThreshold') drawSparks();
  }));
}
function toggleTuner() { $('tuner').classList.toggle('open'); }
$('tClose').onclick = toggleTuner;
$('tReset').onclick = () => { Object.assign(GAME_CONFIG, DEFAULT_CONFIG); buildTuner(); toast(t('to.reset'), 'good'); };
$('tRestart').onclick = () => { toggleTuner(); enterState('PLAYING'); };
$('tCopy').onclick = () => {
  const text = 'const GAME_CONFIG = ' + JSON.stringify(GAME_CONFIG, null, 2) + ';';
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); };
  (navigator.clipboard ? navigator.clipboard.writeText(text).catch(fallback) : Promise.resolve(fallback()))
    .then(() => toast(t('to.copied'), 'good'));
};

// 헤드리스 봇 시뮬레이션: 제너레이터를 25ms 단위로 쪼개 실행해 UI 프리징 방지
let simRunning = false;
$('tSim').onclick = () => {
  if (simRunning) return;
  simRunning = true; $('tSim').disabled = true;
  const cfg = Object.assign({}, GAME_CONFIG), seeds = [0, 1, 2].map(() => (Math.random() * 1e6) | 0);
  const jobs = []; for (const b of ['greedy', 'hoarder', 'eco']) for (const s of seeds) jobs.push([b, s]);
  const results = [];
  let ji = 0, gen = null;
  const out = $('simOut');
  const render = (prog) => {
    let h = `<div class="simbar"><i style="width:${(prog * 100).toFixed(1)}%"></i></div>
      <table><tr><th>${t('tu.thBot')}</th><th>${t('tu.thResult')}</th><th>${t('tu.thTime')}</th><th>${t('tu.thMoney')}</th><th>${t('tu.thSold')}</th><th>${t('tu.thGoal')}</th></tr>`;
    for (const r of results) {
      h += `<tr><td>${t('bot.' + r.bot)}<br><small style="color:var(--dim)">${t('tu.rowSub', { s: r.seed, h: r.maxH, c: r.maxC, k: r.crashes })}</small></td>
        <td>${t('out.' + r.outcome)}</td><td>${mmss(r.time)}</td><td>${fmt(r.money)}<br><small style="color:var(--dim)">${fmt(r.peakMoney)}</small></td>
        <td>${r.soldC}</td><td class="${r.pass ? 'ok' : 'ng'}">${r.pass ? '✓' : '✗'} <small>${t('bot.' + r.bot + '.goal', { v: fmt(cfg.targetMoney) })}</small></td></tr>`;
    }
    out.innerHTML = h + '</table>' + (prog >= 1 ? `<div style="margin-top:8px">${t('tu.done', { p: results.filter(r => r.pass).length, n: results.length })}</div>` : `<div style="margin-top:8px;color:var(--dim)">${t('tu.running', { i: ji + 1, n: jobs.length })}</div>`);
  };
  const pump = () => {
    const t0 = performance.now();
    while (performance.now() - t0 < 25) {
      if (!gen) gen = simulateBot(jobs[ji][0], cfg, jobs[ji][1], 1200);
      const s = gen.next();
      if (s.done) {
        results.push(s.value); gen = null; ji++;
        if (ji >= jobs.length) { render(1); simRunning = false; $('tSim').disabled = false; return; }
      }
    }
    render((ji + 0.5) / jobs.length);
    setTimeout(pump, 0);
  };
  render(0); pump();
};

/* =====================================================================
   [15] 부팅
   ===================================================================== */
applyI18n();
enterState('START_MENU');
world = null;
resize();
requestAnimationFrame(ts => { lastTs = ts; frame(ts); });
</script>
